<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inkwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121014;--panel:#1b1820;--line:rgba(236,230,220,.11);--line-strong:rgba(236,230,220,.24);
  --text:#ece6dc;--dim:#a69fae;--accent:#e0a458;--accent-ink:#1d1206;--accent-soft:rgba(224,164,88,.14);--accent-line:rgba(224,164,88,.45);
  --danger:#e8957f;--danger-line:rgba(232,149,127,.5);
  --font-head:'Literata',Georgia,serif;--font-body:'IBM Plex Sans',system-ui,sans-serif;--font-mono:'IBM Plex Mono',monospace;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit;color:inherit;}
a{color:var(--accent);}
::selection{background:var(--accent-soft);}

/* ── top bar ── */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--line);}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto;cursor:pointer;}
.brand-title{font-family:var(--font-head);font-size:1.35rem;font-weight:600;color:var(--text);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em;}
.brand-sub{font-size:.74rem;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.search{position:relative;width:min(340px,38vw);}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 34px;font-size:.92rem;}
.search input:focus{outline:none;border-color:var(--accent);}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55;}
.proj-sel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:180px;font-size:.88rem;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:8px 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);color:var(--text);cursor:pointer;font-size:.9rem;white-space:nowrap;}
.btn:hover{border-color:var(--accent);}
.btn:focus-visible,.icon-btn:focus-visible,.side a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
.btn.pri:hover{filter:brightness(1.08);}
.btn.ghost{background:transparent;}
.btn.quiet{background:transparent;border-color:transparent;color:var(--dim);}
.btn.quiet:hover{color:var(--text);border-color:var(--line);}
.btn.danger{color:var(--danger);border-color:var(--danger-line);background:transparent;}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn.sm{min-height:30px;padding:4px 10px;font-size:.82rem;}
.btn:disabled{opacity:.45;cursor:default;}
.icon-btn{background:none;border:1px solid transparent;border-radius:8px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;color:var(--dim);cursor:pointer;font-size:1.1rem;}
.icon-btn:hover{color:var(--text);border-color:var(--line);}
.menu-btn{display:none;}

/* ── shell ── */
.shell{display:flex;min-height:calc(100vh - 60px);}
.side{width:260px;flex-shrink:0;border-right:1px solid var(--line);padding:14px 10px 40px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;}
.side-group{margin-top:16px;}
.side-label{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:0 10px 6px;display:flex;justify-content:space-between;align-items:center;}
.side a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:.92rem;cursor:pointer;}
.side a:hover{background:var(--panel);}
.side a.on{background:var(--accent-soft);color:var(--accent);}
.side a .n{margin-left:auto;font-size:.76rem;color:var(--dim);font-variant-numeric:tabular-nums;}
.side a .ic{width:20px;text-align:center;flex-shrink:0;}
.side a.add{color:var(--dim);font-size:.85rem;}
.side a.add:hover{color:var(--accent);}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin:0 5px;}
main{flex:1;min-width:0;padding:22px 28px 80px;}
.scrim{display:none;}

/* ── list ── */
.list-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
.list-head h1{font-family:var(--font-head);font-size:1.9rem;font-weight:600;margin:0;line-height:1.2;}
.list-desc{color:var(--dim);font-size:.93rem;margin:4px 0 14px;max-width:70ch;}
.list-tools{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;}
.list-tools select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.85rem;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px;}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim);background:transparent;cursor:pointer;}
.chip:hover{color:var(--text);border-color:var(--line-strong);}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 12px;cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;text-align:left;}
.card:hover{border-color:var(--line-strong);transform:translateY(-1px);}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--accent));}
.card-type{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--c,var(--dim));display:flex;gap:6px;align-items:center;}
.card-title{font-family:var(--font-head);font-size:1.15rem;font-weight:600;line-height:1.25;}
.card-snip{font-size:.87rem;color:var(--dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.card-foot{display:flex;justify-content:space-between;gap:8px;font-size:.74rem;color:var(--dim);margin-top:auto;padding-top:4px;}
.empty{border:1px dashed var(--line-strong);border-radius:var(--radius);padding:34px 24px;text-align:center;color:var(--dim);}
.empty h3{font-family:var(--font-head);color:var(--text);margin:0 0 6px;font-size:1.25rem;}

/* ── entry ── */
.entry{max-width:820px;}
.crumbs{font-size:.82rem;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.crumbs a{color:var(--dim);cursor:pointer;text-decoration:none;}
.crumbs a:hover{color:var(--accent);}
.entry h1{font-family:var(--font-head);font-size:2.2rem;font-weight:600;line-height:1.15;margin:4px 0 6px;}
.entry-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--dim);margin-bottom:18px;}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--c,var(--line));color:var(--c,var(--dim));}
.entry-actions{display:flex;gap:8px;margin-left:auto;}
.fld{margin:0 0 22px;}
.fld-label{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;font-weight:600;}
.rich p{margin:0 0 10px;}
.rich ul{margin:0 0 10px;padding-left:1.3rem;}
.rich a.wl{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent);cursor:pointer;}
.rich .broken{color:var(--dim);border-bottom:1px dashed var(--dim);}
.refs{display:flex;flex-wrap:wrap;gap:6px;}
.ref{display:inline-flex;align-items:center;gap:5px;font-size:.85rem;padding:4px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--accent-line);color:var(--accent);text-decoration:none;}
.ref:hover{background:var(--accent-soft);}
.ref.plain{color:var(--text);border-color:var(--line);}
.pos{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;background:var(--panel);}
.pos h4{margin:0 0 6px;font-family:var(--font-head);font-size:1.05rem;}
.pos .sub{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:8px 0 3px;}
.links-box{border-top:1px solid var(--line);margin-top:26px;padding-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.links-box h3{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0 0 8px;font-weight:600;}
.lnk{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;font-size:.92rem;}
.lnk:hover .lnk-t{color:var(--accent);}
.lnk-l{font-size:.75rem;color:var(--dim);}
.tags{display:flex;flex-wrap:wrap;gap:6px;}

/* ── forms ── */
.form{max-width:820px;}
.form h1{font-family:var(--font-head);font-size:1.6rem;margin:0 0 16px;font-weight:600;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
label.f{display:block;margin-bottom:14px;}
label.f>span,.f-cap{display:block;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:5px;font-weight:600;}
.f-hint{font-size:.78rem;color:var(--dim);margin-top:4px;}
.inp,textarea.inp,select.inp{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:.95rem;}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5;}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.inp.title{font-family:var(--font-head);font-size:1.4rem;}
.form-actions{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);margin-top:10px;}
.sub-box{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;background:color-mix(in srgb,var(--panel) 60%,transparent);}
.link-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
.link-row .t{flex:1;font-size:.92rem;}

/* ── timeline ── */
.tl{position:relative;margin-left:8px;padding-left:28px;border-left:2px solid var(--line-strong);max-width:820px;}
.tl-item{position:relative;margin-bottom:16px;cursor:pointer;}
.tl-item::before{content:"";position:absolute;left:-36px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--accent));border:3px solid var(--bg);}
.tl-when{font-size:.8rem;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.03em;}
.tl-title{font-family:var(--font-head);font-size:1.12rem;font-weight:600;}
.tl-item:hover .tl-title{color:var(--accent);}
.tl-snip{font-size:.86rem;color:var(--dim);}

/* ── scripture index ── */
.si-work{margin-bottom:24px;}
.si-work h2{font-family:var(--font-head);font-size:1.3rem;margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px;}
.si-book{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);}
.si-book-name{font-weight:600;font-size:.92rem;}
.si-refs{display:flex;flex-direction:column;gap:4px;}
.si-ref{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;font-size:.88rem;}
.si-ref .ent{color:var(--dim);cursor:pointer;}
.si-ref .ent:hover{color:var(--accent);}

/* ── settings ── */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap;}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;color:var(--dim);font-size:.92rem;}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);}
.set-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.set-card h3{margin:0 0 4px;font-family:var(--font-head);font-size:1.1rem;}
.set-card p{margin:0 0 10px;color:var(--dim);font-size:.88rem;}
.set-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.set-row .inp{width:auto;flex:1;min-width:120px;}
.mini{font-size:.78rem;color:var(--dim);}
.field-row{display:grid;grid-template-columns:1fr 150px auto;gap:6px;align-items:center;margin-bottom:6px;}
.field-row .inp{padding:6px 9px;font-size:.88rem;}
.type-head{display:flex;gap:8px;align-items:center;cursor:pointer;}
.type-head .nm{font-weight:600;flex:1;}
.emoji-inp{width:54px!important;flex:0 0 54px!important;min-width:0!important;text-align:center;}
input[type=color].inp{padding:2px;width:46px;flex:0 0 46px;height:38px;}
.group-label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:16px 0 8px;}


/* ── stats, manuscript, journal, reading ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0 14px;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;}
.stat-v{font-family:var(--font-head);font-size:1.7rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;}
.stat-l{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:2px;}
.stat-s{font-size:.8rem;color:var(--dim);margin-top:6px;}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden;}
.bar span{display:block;height:100%;background:var(--accent);border-radius:3px;}
.spark{display:flex;gap:4px;align-items:flex-end;height:46px;margin:4px 0 8px;}
.sp{flex:1;height:100%;display:flex;align-items:flex-end;background:color-mix(in srgb,var(--line) 50%,transparent);border-radius:3px;}
.sp span{display:block;width:100%;background:var(--accent);border-radius:3px;min-height:2px;}
.ms-ch{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.ms-ch-h{display:flex;justify-content:space-between;align-items:baseline;padding:9px 14px;background:var(--panel);font-family:var(--font-head);font-weight:600;font-size:1.05rem;}
.ms-row{display:flex;align-items:center;gap:12px;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer;}
.ms-row:hover{background:var(--accent-soft);}
.ms-o{font-size:.78rem;color:var(--dim);min-width:56px;font-variant-numeric:tabular-nums;}
.ms-t{flex:1;font-weight:500;}
.ms-w{font-size:.82rem;color:var(--dim);font-variant-numeric:tabular-nums;min-width:56px;text-align:right;}
textarea.inp.manu{min-height:58vh;font-family:var(--font-head);font-size:1.12rem;line-height:1.8;padding:18px 20px;}
.manu-view{font-family:var(--font-head);font-size:1.1rem;line-height:1.8;}
.stars{color:var(--accent);letter-spacing:1px;white-space:nowrap;}
.stars .off{opacity:.3;}
.prompt{border-left:3px solid var(--accent);padding:8px 14px;margin:0 0 16px;background:var(--accent-soft);border-radius:0 8px 8px 0;font-family:var(--font-head);font-size:1.08rem;}
.otd{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;}
.j-month{margin-bottom:18px;}
.j-mh{font-family:var(--font-head);font-size:1.25rem;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:6px;}
.j-row{display:flex;gap:14px;padding:10px 6px;border-radius:8px;cursor:pointer;}
.j-row:hover{background:var(--panel);}
.j-day{width:42px;flex-shrink:0;text-align:center;line-height:1.1;}
.j-day b{display:block;font-family:var(--font-head);font-size:1.45rem;color:var(--accent);}
.j-day span{font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;}
.j-body{min-width:0;flex:1;}
.j-t{font-weight:600;}
.spot{margin:4px 0 18px;padding:18px 22px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);}
.spot blockquote{margin:0;font-family:var(--font-head);font-size:1.25rem;line-height:1.5;}
.spot figcaption{margin-top:8px;color:var(--dim);font-size:.9rem;}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:8px;}
.book{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:6px;padding:12px;min-height:120px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;}
.book:hover{border-color:var(--line-strong);border-left-color:var(--c);transform:translateY(-1px);}
.book-t{font-family:var(--font-head);font-weight:600;font-size:1.02rem;line-height:1.25;}
.book-a{font-size:.82rem;color:var(--dim);}
.book-r{margin-top:auto;font-size:.85rem;}

/* ── modal + toast ── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:7vh 14px;overflow-y:auto;}
.modal-ov.on{display:flex;}
.modal{background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;max-width:540px;width:100%;padding:20px;}
.modal h2{font-family:var(--font-head);margin:0 0 6px;font-size:1.35rem;}
.modal p{color:var(--dim);font-size:.9rem;margin:0 0 12px;}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft);}
.radio input{margin-top:4px;accent-color:var(--accent);}
.radio b{display:block;font-weight:600;}
.radio small{color:var(--dim);}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:500;max-width:90vw;text-align:center;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── responsive ── */
@media (max-width:860px){
  .menu-btn{display:inline-flex;}
  .side{position:fixed;left:0;top:0;bottom:0;height:100%;z-index:60;background:var(--bg);transform:translateX(-100%);transition:transform .22s;padding-top:calc(16px + env(safe-area-inset-top,0px));width:280px;}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.5);}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;}
  main{padding:16px 14px 90px;}
  .search{width:auto;flex:1;}
  .brand{display:none;}
  .proj-sel{max-width:110px;}
  .new-txt{display:none;}
  .row2,.links-box{grid-template-columns:1fr;}
  .entry h1{font-size:1.7rem;}
  .si-book{grid-template-columns:1fr;}
  .field-row{grid-template-columns:1fr 110px auto;}
  .list-tools{margin-left:0;width:100%;justify-content:flex-start;}
  .stats{grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;}
  .stat{padding:10px;}
  .stat-v{font-size:1.4rem;}
  .stat-s{font-size:.74rem;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<header class="top">
  <button class="icon-btn menu-btn" data-act="menu" aria-label="Menu">☰</button>
  <div class="brand" data-act="home"><span class="brand-title" id="brandTitle"></span><span class="brand-sub" id="brandSub"></span></div>
  <select class="proj-sel" id="projSel" aria-label="Project" hidden></select>
  <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search…" aria-label="Search" autocomplete="off"></div>
  <button class="btn pri" data-act="new" aria-label="New entry">＋<span class="new-txt"> New</span></button>
</header>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="scrim" id="scrim" data-act="menu-close"></div>
  <main id="main"></main>
</div>
<div class="modal-ov" id="modal"><div class="modal" id="modalBox" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ══ LINKED BACKUPS ══════════════════════════════════════════════════════════
   An add-on to the existing Export/Import — it doesn't replace or change them.
   Three destinations, each a one-button backup/restore once set up:
     • Share sheet / file   — any device. Sends a .json file to the OS share sheet
                              (pick Google Drive, Files, Dropbox…) or saves it.
     • Linked folder        — File System Access API (Chrome/Edge on desktop). The
                              folder choice is remembered in IndexedDB.
     • Google Drive         — Google Identity Services + Drive REST API, drive.file
                              scope (the app can only see files it created itself).
   Usage: BackupLinks.init({...config}) → returns { open() }.
   ═══════════════════════════════════════════════════════════════════════════ */
(function(){
  'use strict';

  var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
  var DRIVE_API = 'https://www.googleapis.com/drive/v3';
  var DRIVE_UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function pad(n){return (n<10?'0':'')+n;}
  function stamp(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());}
  function ago(ts){
    if(!ts)return 'never';
    var s=Math.round((Date.now()-ts)/1000);
    if(s<60)return 'just now';
    var m=Math.round(s/60); if(m<60)return m+' min ago';
    var h=Math.round(m/60); if(h<24)return h+(h===1?' hour ago':' hours ago');
    var d=Math.round(h/24); if(d<30)return d+(d===1?' day ago':' days ago');
    return new Date(ts).toLocaleDateString();
  }
  function fmtDate(ts){var d=new Date(ts);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+', '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
  function fmtSize(b){if(b==null||isNaN(b))return '';b=+b;if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(0)+' KB';return (b/1048576).toFixed(1)+' MB';}

  function init(cfg){
    var KEY = cfg.appKey + '_backuplinks';
    var DB  = cfg.appKey + '-backup-links';
    var t = cfg.theme || {};
    var st = loadSt();
    var folderHandle = null;        // FileSystemDirectoryHandle, restored from IndexedDB
    var folderSupported = typeof window.showDirectoryPicker === 'function';
    var accessToken = null, tokenExp = 0, gisPromise = null;
    var busy = '';                  // short message while an operation runs
    var notice = null;              // {kind:'ok'|'err', text}
    var listing = null;             // {source:'folder'|'drive', items:[...]} for restore picker
    var staged = null;              // {label, getText} pending a replace-confirm
    var armedId = null;             // tap-twice arming for destructive restores

    /* ── persisted settings ── */
    function loadSt(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
    function saveSt(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}

    /* ── IndexedDB (only place a folder handle can be remembered) ── */
    function idb(){
      return new Promise(function(res,rej){
        if(!window.indexedDB){rej(new Error('IndexedDB unavailable'));return;}
        var r=indexedDB.open(DB,1);
        r.onupgradeneeded=function(){r.result.createObjectStore('kv');};
        r.onsuccess=function(){res(r.result);};
        r.onerror=function(){rej(r.error);};
      });
    }
    function idbOp(mode,fn){
      return idb().then(function(db){return new Promise(function(res,rej){
        var tx=db.transaction('kv',mode),req=fn(tx.objectStore('kv'));
        tx.oncomplete=function(){res(req&&req.result);};
        tx.onerror=function(){rej(tx.error);};
      });});
    }
    function idbGet(k){return idbOp('readonly',function(s){return s.get(k);});}
    function idbSet(k,v){return idbOp('readwrite',function(s){return s.put(v,k);});}
    function idbDel(k){return idbOp('readwrite',function(s){return s.delete(k);});}

    /* ── styles ── */
    var css=
      '.blk-ov{position:fixed;inset:0;background:'+(t.overlay||'rgba(0,0,0,.72)')+';z-index:'+(t.z||400)+';display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:5vh 14px;-webkit-overflow-scrolling:touch;}'+
      '.blk-ov.on{display:flex;}'+
      '.blk{background:'+t.panel+';color:'+t.text+';border:1px solid '+t.line+';border-radius:12px;width:100%;max-width:560px;padding:20px 20px 16px;font-family:'+t.body+';margin-bottom:5vh;}'+
      '.blk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px;}'+
      '.blk h2{font-family:'+t.head+';font-size:1.3rem;font-weight:600;color:'+t.accent+';margin:0;}'+
      '.blk-x{background:none;border:none;color:'+t.dim+';font-size:1.4rem;cursor:pointer;padding:2px 6px;line-height:1;}'+
      '.blk-status{font-size:.86rem;color:'+t.dim+';margin-bottom:14px;line-height:1.45;}'+
      '.blk-all{width:100%;margin-bottom:6px;}'+
      '.blk-sec{border-top:1px solid '+t.line+';padding:14px 0 12px;}'+
      '.blk-sec h3{font-family:'+t.head+';font-size:1rem;font-weight:600;margin:0 0 4px;color:'+t.text+';display:flex;align-items:center;gap:8px;}'+
      '.blk-dot{width:8px;height:8px;border-radius:50%;background:'+t.dim+';opacity:.5;flex-shrink:0;}'+
      '.blk-dot.on{background:'+t.ok+';opacity:1;box-shadow:0 0 0 3px '+t.okBg+';}'+
      '.blk-p{font-size:.86rem;color:'+t.dim+';line-height:1.5;margin:0 0 10px;}'+
      '.blk-p b{color:'+t.text+';font-weight:600;}'+
      '.blk-row{display:flex;flex-wrap:wrap;gap:8px;}'+
      '.blk-btn{font-family:'+t.btnFont+';font-size:'+t.btnSize+';letter-spacing:.06em;text-transform:'+(t.btnCase||'none')+';background:'+t.btnBg+';color:'+t.accent+';border:1px solid '+t.accentLine+';border-radius:6px;padding:9px 13px;min-height:38px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;}'+
      '.blk-btn:hover:not(:disabled){border-color:'+t.accent+';}'+
      '.blk-btn:focus-visible{outline:2px solid '+t.accent+';outline-offset:2px;}'+
      '.blk-btn.pri{background:'+t.accentBg+';border-color:'+t.accent+';font-weight:600;}'+
      '.blk-btn.quiet{background:transparent;color:'+t.dim+';border-color:'+t.line+';}'+
      '.blk-btn.danger{color:'+t.danger+';border-color:'+t.danger+';background:'+t.dangerBg+';}'+
      '.blk-btn.armed{background:'+t.danger+';color:#fff;border-color:'+t.danger+';}'+
      '.blk-btn:disabled{opacity:.4;cursor:default;}'+
      '.blk-note{font-size:.84rem;line-height:1.5;border-radius:8px;padding:10px 12px;margin:0 0 12px;}'+
      '.blk-note.ok{background:'+t.okBg+';color:'+t.ok+';border:1px solid '+t.ok+';}'+
      '.blk-note.err{background:'+t.dangerBg+';color:'+t.danger+';border:1px solid '+t.danger+';}'+
      '.blk-note.busy{background:'+t.accentBg+';color:'+t.accent+';border:1px solid '+t.accentLine+';}'+
      '.blk-note.warn{background:'+t.dangerBg+';color:'+t.text+';border:1px solid '+t.danger+';}'+
      '.blk-list{margin-top:10px;border:1px solid '+t.line+';border-radius:8px;overflow:hidden;}'+
      '.blk-li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-top:1px solid '+t.line+';}'+
      '.blk-li:first-child{border-top:none;}'+
      '.blk-li-name{font-family:'+t.mono+';font-size:.74rem;color:'+t.text+';word-break:break-all;}'+
      '.blk-li-meta{font-size:.76rem;color:'+t.dim+';margin-top:2px;}'+
      '.blk-list-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:.8rem;color:'+t.dim+';background:'+t.accentBg+';}'+
      '.blk-inp{width:100%;background:'+(t.inputBg||'rgba(0,0,0,.25)')+';border:1px solid '+t.line+';border-radius:6px;color:'+t.text+';font-family:'+t.mono+';font-size:.78rem;padding:9px 10px;margin-bottom:8px;}'+
      '.blk-inp:focus{outline:none;border-color:'+t.accent+';}'+
      '.blk details{margin-top:8px;font-size:.84rem;color:'+t.dim+';}'+
      '.blk summary{cursor:pointer;color:'+t.accent+';margin-bottom:6px;}'+
      '.blk ol{margin:6px 0 4px 1.2rem;padding:0;line-height:1.55;}'+
      '.blk ol li{margin-bottom:5px;}'+
      '.blk code{font-family:'+t.mono+';font-size:.76rem;background:'+(t.inputBg?t.accentBg:'rgba(0,0,0,.3)')+';padding:1px 5px;border-radius:4px;color:'+t.text+';word-break:break-all;}'+
      '.blk-foot{font-size:.76rem;color:'+t.dim+';border-top:1px solid '+t.line+';padding-top:10px;line-height:1.5;}';
    var styleEl=document.createElement('style');styleEl.textContent=css;document.head.appendChild(styleEl);

    var ov=document.createElement('div');
    ov.className='blk-ov';
    ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Linked backups');
    ov.innerHTML='<div class="blk" id="'+cfg.appKey+'-blk"></div>';
    document.body.appendChild(ov);
    var panel=ov.firstChild;
    var fileInput=document.createElement('input');
    fileInput.type='file';fileInput.accept='.json,application/json,text/plain';fileInput.style.display='none';
    document.body.appendChild(fileInput);

    ov.addEventListener('click',function(e){if(e.target===ov)close();});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ov.classList.contains('on'))close();});
    panel.addEventListener('click',onClick);
    fileInput.addEventListener('change',function(){
      var f=fileInput.files&&fileInput.files[0];fileInput.value='';
      if(!f)return;
      stageOrRestore({id:'file',label:f.name,getText:function(){return f.text();}},'a file');
    });

    // restore remembered folder handle in the background
    idbGet('folder').then(function(h){if(h){folderHandle=h;render();}}).catch(function(){});

    /* ── helpers ── */
    function fileName(){return cfg.filePrefix+'-'+stamp()+'.json';}
    function isLocalFile(){return location.protocol==='file:';}
    function driveReady(){return !!st.driveClientId;}
    function linkedCount(){return (folderHandle?1:0)+(st.driveConnected&&driveReady()&&!isLocalFile()?1:0);}
    function recordBackup(where){
      st.lastBackup={ts:Date.now(),where:where};saveSt();
      try{cfg.onBackedUp&&cfg.onBackedUp(where);}catch(e){}
    }
    function setBusy(m){busy=m;notice=null;render();}
    function done(kind,text){busy='';notice={kind:kind,text:text};render();}
    function fail(e,prefix){
      if(e&&e.name==='AbortError'){busy='';render();return;}   // user closed a picker — not an error
      console.error('Linked backup:',e);
      done('err',(prefix?prefix+' ':'')+(e&&e.message?e.message:String(e)));
    }

    /* ── share sheet / file ── */
    function saveViaShareOrDownload(){
      var json=cfg.getJSON(), name=fileName();
      var file=null;
      try{file=new File([json],name,{type:'application/json'});}catch(e){}
      if(file&&navigator.canShare&&navigator.share){
        var can=false;try{can=navigator.canShare({files:[file]});}catch(e){}
        if(can){
          setBusy('Opening your share sheet…');
          navigator.share({files:[file],title:cfg.appName+' backup'}).then(function(){
            recordBackup('your share sheet');
            done('ok','Backup file sent: '+name);
          }).catch(function(e){
            if(e&&e.name==='AbortError'){busy='';render();return;}
            download(json,name);
          });
          return;
        }
      }
      download(json,name);
    }
    function download(json,name){
      var url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
      var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},4000);
      recordBackup('a downloaded file');
      done('ok','Saved '+name+' to your downloads.');
    }

    /* ── linked folder ── */
    function ensurePerm(h){
      var o={mode:'readwrite'};
      return h.queryPermission(o).then(function(p){
        if(p==='granted')return true;
        return h.requestPermission(o).then(function(p2){return p2==='granted';});
      });
    }
    function linkFolder(){
      window.showDirectoryPicker({id:cfg.appKey+'-backups',mode:'readwrite'}).then(function(h){
        folderHandle=h;listing=null;
        return idbSet('folder',h).catch(function(){}).then(function(){done('ok','Linked folder “'+h.name+'”. Backups will be saved there.');});
      }).catch(function(e){fail(e,'Couldn’t link that folder.');});
    }
    function unlinkFolder(){
      folderHandle=null;if(listing&&listing.source==='folder')listing=null;
      idbDel('folder').catch(function(){});
      done('ok','Folder unlinked. Files already in it are untouched.');
    }
    function backupToFolder(){
      if(!folderHandle)return Promise.reject(new Error('No folder linked.'));
      var name=fileName(),json=cfg.getJSON();
      return ensurePerm(folderHandle).then(function(ok){
        if(!ok)throw new Error('Permission to write to “'+folderHandle.name+'” was not granted.');
        return folderHandle.getFileHandle(name,{create:true});
      }).then(function(fh){return fh.createWritable();})
        .then(function(w){return w.write(json).then(function(){return w.close();});})
        .then(function(){return name;});
    }
    function listFolder(){
      setBusy('Reading “'+folderHandle.name+'”…');
      ensurePerm(folderHandle).then(function(ok){
        if(!ok)throw new Error('Permission to read “'+folderHandle.name+'” was not granted.');
        var out=[],it=folderHandle.values();
        function step(){
          return it.next().then(function(r){
            if(r.done)return;
            var h=r.value;
            if(h.kind==='file'&&/\.json$/i.test(h.name)){
              return h.getFile().then(function(f){
                out.push({id:'f:'+h.name,name:h.name,time:f.lastModified,size:f.size,getText:function(){return h.getFile().then(function(ff){return ff.text();});}});
              }).then(step);
            }
            return step();
          });
        }
        return step().then(function(){return out;});
      }).then(function(items){
        items.sort(function(a,b){return b.time-a.time;});
        listing={source:'folder',title:'JSON files in “'+folderHandle.name+'”',items:items.slice(0,30)};
        busy='';notice=null;render();
      }).catch(function(e){fail(e,'Couldn’t read the folder.');});
    }

    /* ── Google Drive ── */
    function loadGIS(){
      if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();
      if(gisPromise)return gisPromise;
      gisPromise=new Promise(function(res,rej){
        var s=document.createElement('script');
        s.src='https://accounts.google.com/gsi/client';s.async=true;
        s.onload=function(){res();};
        s.onerror=function(){gisPromise=null;rej(new Error('Couldn’t load Google sign-in. Check your internet connection.'));};
        document.head.appendChild(s);
      });
      return gisPromise;
    }
    function getToken(forcePrompt){
      if(!forcePrompt&&accessToken&&Date.now()<tokenExp-60000)return Promise.resolve(accessToken);
      return loadGIS().then(function(){
        return new Promise(function(res,rej){
          var client=google.accounts.oauth2.initTokenClient({
            client_id:st.driveClientId,
            scope:DRIVE_SCOPE,
            callback:function(r){
              if(r.error){rej(new Error(r.error_description||r.error));return;}
              accessToken=r.access_token;tokenExp=Date.now()+(r.expires_in||3600)*1000;
              if(!st.driveConnected){st.driveConnected=true;saveSt();}
              res(accessToken);
            },
            error_callback:function(e){
              var m=(e&&e.type==='popup_closed')?'The Google sign-in window was closed.':
                    (e&&e.type==='popup_failed_to_open')?'Your browser blocked the Google sign-in pop-up. Allow pop-ups for this page and try again.':
                    ((e&&(e.message||e.type))||'Google sign-in didn’t finish.');
              rej(new Error(m));
            }
          });
          client.requestAccessToken({prompt:st.driveConnected&&!forcePrompt?'':'consent'});
        });
      });
    }
    function gfetch(url,opts,retried){
      opts=opts||{};
      return getToken().then(function(tok){
        var o=Object.assign({},opts);o.headers=Object.assign({Authorization:'Bearer '+tok},opts.headers||{});
        return fetch(url,o);
      }).then(function(r){
        if(r.status===401&&!retried){accessToken=null;return gfetch(url,opts,true);}
        if(!r.ok){
          return r.text().then(function(txt){
            var m='';try{m=JSON.parse(txt).error.message;}catch(e){}
            throw new Error('Google Drive said: '+(m||('error '+r.status)));
          });
        }
        return r;
      });
    }
    function driveFolderId(){
      var q="name='"+cfg.driveFolderName.replace(/'/g,"\\'")+"' and mimeType='application/vnd.google-apps.folder' and trashed=false";
      return gfetch(DRIVE_API+'/files?spaces=drive&fields=files(id,name)&q='+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(j){
        if(j.files&&j.files.length)return j.files[0].id;
        return gfetch(DRIVE_API+'/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({name:cfg.driveFolderName,mimeType:'application/vnd.google-apps.folder'})})
          .then(function(r){return r.json();}).then(function(f){return f.id;});
      });
    }
    function backupToDrive(){
      var name=fileName(),json=cfg.getJSON();
      return driveFolderId().then(function(folderId){
        var meta={name:name,parents:[folderId],mimeType:'application/json'};
        var blob=new Blob([json],{type:'application/json'});
        if(blob.size<4500000){
          var b='blk'+Math.random().toString(36).slice(2);
          var body=new Blob(['--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n',blob,'\r\n--'+b+'--'],{type:'multipart/related; boundary='+b});
          return gfetch(DRIVE_UPLOAD+'?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:body});
        }
        // Large backups (lots of images) go through a resumable upload session.
        return gfetch(DRIVE_UPLOAD+'?uploadType=resumable&fields=id',{method:'POST',
          headers:{'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':'application/json'},body:JSON.stringify(meta)})
          .then(function(r){
            var loc=r.headers.get('Location');
            if(!loc)throw new Error('Google Drive didn’t return an upload address for this large backup.');
            return fetch(loc,{method:'PUT',headers:{'Content-Type':'application/json'},body:blob});
          }).then(function(r){if(!r.ok)throw new Error('Google Drive upload failed (error '+r.status+').');});
      }).then(function(){return name;});
    }
    function listDrive(){
      setBusy('Looking in Google Drive…');
      driveFolderId().then(function(fid){
        var q="'"+fid+"' in parents and trashed=false";
        return gfetch(DRIVE_API+'/files?pageSize=30&orderBy=modifiedTime%20desc&fields=files(id,name,modifiedTime,size)&q='+encodeURIComponent(q));
      }).then(function(r){return r.json();}).then(function(j){
        var items=(j.files||[]).map(function(f){
          return {id:'d:'+f.id,name:f.name,time:Date.parse(f.modifiedTime),size:f.size,
            getText:function(){return gfetch(DRIVE_API+'/files/'+encodeURIComponent(f.id)+'?alt=media').then(function(r){return r.text();});}};
        });
        listing={source:'drive',title:'Backups in Drive folder “'+cfg.driveFolderName+'”',items:items};
        busy='';notice=null;render();
      }).catch(function(e){fail(e,'Couldn’t list Drive backups.');});
    }
    function disconnectDrive(){
      try{if(accessToken&&window.google&&google.accounts&&google.accounts.oauth2)google.accounts.oauth2.revoke(accessToken,function(){});}catch(e){}
      accessToken=null;tokenExp=0;st.driveConnected=false;saveSt();
      if(listing&&listing.source==='drive')listing=null;
      done('ok','Disconnected from Google Drive. Your backups stay in Drive.');
    }

    /* ── restore ── */
    function stageOrRestore(item,fromWhere){
      if(cfg.restoreMode==='replace'){
        staged={item:item,from:fromWhere};armedId=null;notice=null;busy='';render();
        var el=panel.querySelector('.blk-stage');if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest',behavior:'smooth'});
        return;
      }
      runRestore(item);
    }
    function runRestore(item){
      setBusy('Restoring '+item.label+'…');
      Promise.resolve().then(function(){return item.getText();}).then(function(text){
        return cfg.restore(text);
      }).then(function(msg){
        staged=null;armedId=null;
        done('ok',msg||('Restored from '+item.label+'.'));
      }).catch(function(e){
        staged=null;armedId=null;
        fail(e,'Restore didn’t happen — nothing was changed.');
      });
    }

    /* ── actions ── */
    function backupAll(){
      var jobs=[];
      if(folderHandle)jobs.push(backupToFolder().then(function(){return 'folder “'+folderHandle.name+'”';}));
      if(linkedCount()>(folderHandle?1:0))jobs.push(backupToDrive().then(function(){return 'Google Drive';}));
      setBusy('Backing up to '+jobs.length+' destination'+(jobs.length>1?'s':'')+'…');
      Promise.all(jobs.map(function(p){return p.then(function(w){return {ok:true,w:w};},function(e){return {ok:false,e:e};});})).then(function(rs){
        var good=rs.filter(function(r){return r.ok;}).map(function(r){return r.w;});
        var bad=rs.filter(function(r){return !r.ok;});
        if(good.length)recordBackup(good.join(' and '));
        if(!bad.length)done('ok','Backed up to '+good.join(' and ')+'.');
        else done('err',(good.length?'Backed up to '+good.join(' and ')+', but ':'')+'one destination failed: '+(bad[0].e&&bad[0].e.message||bad[0].e));
      });
    }

    function onClick(e){
      var b=e.target.closest('[data-a]');if(!b||b.disabled)return;
      var a=b.getAttribute('data-a');
      if(a!=='arm'&&a!=='confirm')armedId=null;
      switch(a){
        case 'close':close();break;
        case 'all':backupAll();break;
        case 'share':saveViaShareOrDownload();break;
        case 'openfile':fileInput.click();break;
        case 'link':linkFolder();break;
        case 'unlink':unlinkFolder();break;
        case 'folder-up':
          setBusy('Saving to “'+folderHandle.name+'”…');
          backupToFolder().then(function(n){recordBackup('folder “'+folderHandle.name+'”');done('ok','Saved '+n+' to “'+folderHandle.name+'”.');}).catch(function(e){fail(e,'Backup to folder failed.');});
          break;
        case 'folder-list':listFolder();break;
        case 'drive-save-id':{
          var v=(panel.querySelector('#'+cfg.appKey+'-blk-cid').value||'').trim();
          if(!/\.apps\.googleusercontent\.com$/.test(v)){done('err','That doesn’t look like an OAuth client ID. It ends in “.apps.googleusercontent.com”.');break;}
          st.driveClientId=v;st.driveConnected=false;accessToken=null;saveSt();loadGIS().catch(function(){});
          done('ok','Client ID saved. Tap Connect to sign in to Google.');
          break;
        }
        case 'drive-forget-id':
          disconnectDrive();st.driveClientId='';saveSt();done('ok','Client ID removed.');break;
        case 'drive-connect':
          setBusy('Waiting for Google sign-in…');
          getToken(true).then(function(){return driveFolderId();}).then(function(){done('ok','Connected to Google Drive. Backups go to the folder “'+cfg.driveFolderName+'”.');}).catch(function(e){fail(e,'Couldn’t connect.');});
          break;
        case 'drive-up':
          setBusy('Uploading to Google Drive…');
          backupToDrive().then(function(n){recordBackup('Google Drive');done('ok','Uploaded '+n+' to Drive.');}).catch(function(e){fail(e,'Upload failed.');});
          break;
        case 'drive-list':listDrive();break;
        case 'drive-disconnect':disconnectDrive();break;
        case 'pick':{
          var id=b.getAttribute('data-id');
          var it=listing&&listing.items.filter(function(x){return x.id===id;})[0];
          if(it)stageOrRestore({id:it.id,label:it.name,getText:it.getText},listing.source==='drive'?'Google Drive':'your folder');
          break;
        }
        case 'hide-list':listing=null;render();break;
        case 'cancel-stage':staged=null;armedId=null;render();break;
        case 'arm':armedId='stage';render();break;
        case 'confirm':if(staged)runRestore(staged.item);break;
      }
    }

    /* ── render ── */
    function btn(a,label,cls,dis,extra){return '<button type="button" class="blk-btn '+(cls||'')+'" data-a="'+a+'"'+(dis?' disabled':'')+(extra||'')+'>'+label+'</button>';}

    function render(){
      var dis=!!busy, h='';
      var lb=st.lastBackup;
      h+='<div class="blk-head"><h2>Linked backups</h2><button type="button" class="blk-x" data-a="close" aria-label="Close">×</button></div>';
      h+='<p class="blk-status">'+(lb?'Last backup '+esc(ago(lb.ts))+' to '+esc(lb.where)+'.':'No backups made from here yet.')+
         ' Your regular Export and Import still work as before.</p>';

      if(busy)h+='<div class="blk-note busy" role="status">'+esc(busy)+'</div>';
      else if(notice)h+='<div class="blk-note '+notice.kind+'" role="status">'+esc(notice.text)+'</div>';

      var n=linkedCount();
      if(n>0)h+=btn('all',n>1?'Back up to all linked ('+n+')':'Back up now','pri blk-all',dis);

      if(staged){
        h+='<div class="blk-note warn blk-stage"><b>Restore “'+esc(staged.item.label)+'” from '+esc(staged.from)+'?</b><br>'+esc(cfg.restoreWarning)+
           '<div class="blk-row" style="margin-top:10px">'+
           (armedId==='stage'?btn('confirm','Tap again to restore','armed',dis):btn('arm','Restore this backup','danger',dis))+
           btn('cancel-stage','Cancel','quiet',dis)+'</div></div>';
      }

      // 1 — share sheet / file
      h+='<div class="blk-sec"><h3><span class="blk-dot on"></span>Share sheet or file</h3>'+
         '<p class="blk-p">Works on any device. On a phone, <b>Send backup file</b> opens your share sheet, where you can pick Google Drive, Files, or another app. On a computer it saves a file. <b>Open backup file</b> restores from any file you can browse to.</p>'+
         '<div class="blk-row">'+btn('share','Send backup file','pri',dis)+btn('openfile','Open backup file','',dis)+'</div></div>';

      // 2 — linked folder
      h+='<div class="blk-sec"><h3><span class="blk-dot'+(folderHandle?' on':'')+'"></span>Linked folder</h3>';
      if(!folderSupported){
        h+='<p class="blk-p">This browser can’t link a folder. Folder linking works in Chrome or Edge on a computer. Use <b>Send backup file</b> above instead.</p>';
      } else if(!folderHandle){
        h+='<p class="blk-p">Pick a folder once, such as a Google Drive, Dropbox, or OneDrive folder synced to your computer. After that, each backup is one tap.</p>'+
           '<div class="blk-row">'+btn('link','Choose folder','pri',dis)+'</div>';
      } else {
        h+='<p class="blk-p">Saving to <b>'+esc(folderHandle.name)+'</b>. Each backup is a new dated file. Your browser may ask once per visit to allow access.</p>'+
           '<div class="blk-row">'+btn('folder-up','Back up to folder','pri',dis)+btn('folder-list','Restore from folder','',dis)+btn('link','Change folder','quiet',dis)+btn('unlink','Unlink','quiet',dis)+'</div>';
      }
      h+='</div>';

      // 3 — Google Drive
      var local=isLocalFile();
      h+='<div class="blk-sec"><h3><span class="blk-dot'+(st.driveConnected&&driveReady()&&!local?' on':'')+'"></span>Google Drive</h3>';
      if(local){
        h+='<p class="blk-p">Google doesn’t allow sign-in from a page opened as a file on your device, which is how this page is open right now. To back up to Drive today, use <b>Send backup file</b> above and pick Drive. Or, on a computer, link your synced Google Drive folder. Direct Drive backup turns on when this page is opened from a web address. See the setup steps below.</p>';
      } else if(!driveReady()){
        h+='<p class="blk-p">One-time setup: paste a Google OAuth client ID, then sign in. Backups go to a folder named <b>'+esc(cfg.driveFolderName)+'</b>. This app can only see the files it creates there.</p>'+
           '<input class="blk-inp" id="'+cfg.appKey+'-blk-cid" placeholder="1234567890-abc…apps.googleusercontent.com" autocomplete="off" spellcheck="false">'+
           '<div class="blk-row">'+btn('drive-save-id','Save client ID','pri',dis)+'</div>';
      } else if(!st.driveConnected){
        h+='<p class="blk-p">Client ID saved. Connect to sign in with Google.</p>'+
           '<div class="blk-row">'+btn('drive-connect','Connect Google Drive','pri',dis)+btn('drive-forget-id','Remove client ID','quiet',dis)+'</div>';
      } else {
        h+='<p class="blk-p">Connected. Backups go to <b>'+esc(cfg.driveFolderName)+'</b> in your Drive. Google may ask you to confirm sign-in again after an hour.</p>'+
           '<div class="blk-row">'+btn('drive-up','Back up to Drive','pri',dis)+btn('drive-list','Restore from Drive','',dis)+btn('drive-disconnect','Disconnect','quiet',dis)+'</div>';
      }
      h+='<details><summary>How to set up direct Drive backup</summary><ol>'+
         '<li>Open this page from a web address instead of a file, for example by hosting it free on GitHub Pages or Netlify Drop.</li>'+
         '<li>At <code>console.cloud.google.com</code>, create a project and enable the <b>Google Drive API</b>.</li>'+
         '<li>Under <b>OAuth consent screen</b>, choose External and add your own Google account as a test user.</li>'+
         '<li>Under <b>Credentials</b>, create an <b>OAuth client ID</b> of type Web application. Add this page’s address to Authorized JavaScript origins'+(local?'.':': <code>'+esc(location.origin)+'</code>')+'</li>'+
         '<li>Paste the client ID here and tap Connect.</li></ol></details>';
      h+='</div>';

      // restore picker
      if(listing){
        h+='<div class="blk-list"><div class="blk-list-head"><span>'+esc(listing.title)+'</span>'+btn('hide-list','Hide','quiet',false)+'</div>';
        if(!listing.items.length)h+='<div class="blk-li"><span class="blk-li-meta">No backup files found here yet.</span></div>';
        listing.items.forEach(function(it){
          h+='<div class="blk-li"><div><div class="blk-li-name">'+esc(it.name)+'</div><div class="blk-li-meta">'+esc(fmtDate(it.time))+(it.size?' · '+esc(fmtSize(it.size)):'')+'</div></div>'+
             btn('pick','Restore','',dis,' data-id="'+esc(it.id)+'"')+'</div>';
        });
        h+='</div>';
      }

      h+='<p class="blk-foot" style="margin-top:12px">'+esc(cfg.footNote||'')+'</p>';
      panel.innerHTML=h;
    }

    function open(){
      notice=null;staged=null;armedId=null;
      if(driveReady()&&!isLocalFile())loadGIS().catch(function(){});   // preload so sign-in pop-ups aren't blocked
      render();ov.classList.add('on');
      var x=panel.querySelector('.blk-x');if(x)x.focus();
    }
    function close(){ov.classList.remove('on');staged=null;armedId=null;}

    return {open:open,close:close};
  }

  // Standalone helper: send any text as a file via the share sheet, or download it.
  function shareOrDownload(text,name,mime){
    mime=mime||'application/json';
    var file=null;try{file=new File([text],name,{type:mime});}catch(e){}
    function dl(){
      var url=URL.createObjectURL(new Blob([text],{type:mime}));
      var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},4000);
      return 'downloaded';
    }
    if(file&&navigator.canShare&&navigator.share){
      var can=false;try{can=navigator.canShare({files:[file]});}catch(e){}
      if(can)return navigator.share({files:[file],title:name}).then(function(){return 'shared';},function(e){
        if(e&&e.name==='AbortError')return 'cancelled';return dl();});
    }
    return Promise.resolve(dl());
  }
  window.BackupLinks={init:init,shareOrDownload:shareOrDownload};
})();

</script>

<script>
/* ══ ENGINE ══════════════════════════════════════════════════════════════════
   One engine, configured by PRESET. Data shape (saved in localStorage):
   { version, app, activeProject, settings:{title,subtitle,accent},
     projects:[{ id, name, sections:[{id,name,group,description,defaultType}],
                 types:[{id,name,icon,color,fields:[{id,label,kind,options}]}],
                 entries:[{id,typeId,sectionId,title,fields:{},tags:[],links:[{to,label}],createdAt,updatedAt}],
                 trash:[...entries with deletedAt], meta:{lastArchiveExportAt} }] }
   ═══════════════════════════════════════════════════════════════════════════ */
(function(){
'use strict';
var P = window.PRESET;
var KEY = P.storageKey;
var KINDS = [
  ['text','Short text'],['longtext','Long text'],['list','List'],
  ['date','Date / year'],['when','Custom date'],['select','Choice'],
  ['url','Web link'],['positions','Positions'],['rating','Rating (stars)'],['manuscript','Manuscript text']
];
if(P.scripture) KINDS.splice(3,0,['refs','Scriptures']);

var root, proj;
var st = {view:'list', section:null, type:null, tag:null, entry:null, sort:'updated', tab:'general', openType:null};
var draft = null;          // entry being edited
var $ = function(id){return document.getElementById(id);};

/* ── utilities ── */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function now(){return new Date().toISOString();}
function fmtDate(iso){if(!iso)return '';var d=new Date(iso);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');},2600);}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'export';}
function armOrRun(btn,fn){
  if(btn.dataset.armed){fn();return;}
  btn.dataset.armed='1';btn._old=btn.innerHTML;btn.textContent='Tap again to confirm';btn.classList.add('armed');
  setTimeout(function(){if(btn.isConnected&&btn.dataset.armed){delete btn.dataset.armed;btn.innerHTML=btn._old;btn.classList.remove('armed');}},4000);
}

function pad2(n){return (n<10?'0':'')+n;}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function longDate(d){return (d||new Date()).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function wc(t){t=String(t||'').trim();return t?t.split(/\s+/).length:0;}
function entryWords(e){var n=0;typeOf(e).fields.forEach(function(f){if(f.kind==='manuscript')n+=wc(e.fields[f.id]);});return n;}
function stars(n){n=+n||0;return n?'<span class="stars" aria-label="'+n+' of 5 stars">'+'★'.repeat(n)+'<span class="off">'+'☆'.repeat(5-n)+'</span></span>':'';}
function isPrivate(e){var s=secById(e.sectionId);return !!(s&&s.private);}
function visible(e){return st.showPrivate||!isPrivate(e);}
function fieldOf(e,kind){var f=typeOf(e).fields.filter(function(x){return x.kind===kind;})[0];return f?e.fields[f.id]:null;}
function dateOf(e){
  var v=fieldOf(e,'date'),m=v&&String(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  return e.createdAt?new Date(e.createdAt):null;
}
function dkey(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}

/* ── storage ── */
function makeProject(name,tplKey){
  var t=P.templates[tplKey]||P.templates[Object.keys(P.templates)[0]];
  var p={id:uid(),name:name,template:tplKey,sections:clone(t.sections||[]),types:clone(t.types),entries:[],trash:[],meta:{}};
  if(t.seed)t.seed.forEach(function(s){
    var e=clone(s);e.id=e.id||uid();e.createdAt=e.updatedAt=now();e.tags=e.tags||[];e.links=e.links||[];e.fields=e.fields||{};
    p.entries.push(e);
  });
  return p;
}
function freshRoot(){
  var p=makeProject(P.firstProject.name,P.firstProject.template);
  return {version:1,app:P.appKey,activeProject:p.id,settings:{title:P.title,subtitle:P.subtitle,accent:null},projects:[p]};
}
function isRoot(r){return r&&typeof r==='object'&&Array.isArray(r.projects)&&r.projects.length>0;}
function load(){
  var r=null;try{r=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  root=isRoot(r)?r:freshRoot();
  root.settings=root.settings||{title:P.title,subtitle:P.subtitle};
  root.projects.forEach(function(p){p.sections=p.sections||[];p.types=p.types||[];p.entries=p.entries||[];p.trash=p.trash||[];p.meta=p.meta||{};});
  proj=root.projects.filter(function(p){return p.id===root.activeProject;})[0]||root.projects[0];
  root.activeProject=proj.id;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(root));return true;}
  catch(e){toast('Storage is full — back up and remove some entries.');return false;}
}

/* ── lookups ── */
function typeOf(e){return proj.types.filter(function(t){return t.id===e.typeId;})[0]||{id:'?',name:'Entry',icon:'•',color:'var(--dim)',fields:[]};}
function typeById(id){return proj.types.filter(function(t){return t.id===id;})[0];}
function secById(id){return proj.sections.filter(function(s){return s.id===id;})[0];}
function entryById(id){return proj.entries.filter(function(e){return e.id===id;})[0];}
function entryByTitle(t){t=String(t).trim().toLowerCase();return proj.entries.filter(function(e){return e.title.trim().toLowerCase()===t;})[0];}
function groups(){
  var order=(P.groups||[]).slice();
  proj.sections.forEach(function(s){var g=s.group||'';if(order.indexOf(g)<0)order.push(g);});
  return order.filter(function(g){return proj.sections.some(function(s){return (s.group||'')===g;});});
}
function fieldText(e){
  var out=[];typeOf(e).fields.forEach(function(f){var v=e.fields[f.id];if(v==null)return;
    if(f.kind==='positions'&&Array.isArray(v))v.forEach(function(p){out.push(p.name,p.statement,p.evidence);});
    else if(f.kind==='when'&&v&&typeof v==='object')out.push(v.label);
    else out.push(String(v));});
  return out.join(' ');
}
function snippet(e){
  var t=typeOf(e);
  var order=t.fields.filter(function(f){return f.kind==='longtext';}).concat(t.fields.filter(function(f){return f.kind==='manuscript';}),t.fields.filter(function(f){return f.kind==='text';}));
  for(var i=0;i<order.length;i++){var f=order[i],v=e.fields[f.id];
    if(v&&String(v).trim())return String(v).replace(/\[\[([^\]|]+)(\|([^\]]+))?\]\]/g,function(m,a,b,c){return c||a;}).replace(/\*\*?/g,'').slice(0,180);}
  return '';
}

/* ── dates & timeline ── */
var MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function parseWhen(v,kind){
  if(v==null||v==='')return null;
  if(kind==='when'){if(typeof v!=='object')return null;var o=parseFloat(v.order);return isNaN(o)?null:{key:o,label:v.label||String(v.order)};}
  var s=String(v).trim(),iso=s.match(/^(-?\d{1,4})-(\d{1,2})(?:-(\d{1,2}))?/);
  if(iso)return {key:+iso[1]+(+iso[2]-1)/12+((+iso[3]||1)-1)/365,label:s};
  var bc=s.match(/(\d{1,4})\s*(BC|BCE|B\.C\.)/i),yr=s.match(/\b(\d{3,4})\b/),any=s.match(/\d{1,4}/);
  var y=bc?-(+bc[1]):yr?+yr[1]:any?+any[0]:null;if(y==null)return null;
  var mo=-1;MONTHS.forEach(function(n,i){if(new RegExp('\\b'+n,'i').test(s))mo=i;});
  var d=s.match(/\b(\d{1,2})(?:st|nd|rd|th)?,/);
  return {key:y+(mo>=0?mo/12:0)+(d?(+d[1]-1)/365:0),label:s};
}
function whenOf(e){
  var fs=typeOf(e).fields;
  for(var i=0;i<fs.length;i++)if(fs[i].kind==='date'||fs[i].kind==='when'){var w=parseWhen(e.fields[fs[i].id],fs[i].kind);if(w)return w;}
  return null;
}

/* ── scripture references (Latter-day Saint standard works) ── */
var WORKS=[['ot','Old Testament'],['nt','New Testament'],['bofm','Book of Mormon'],['dc-testament','Doctrine and Covenants'],['pgp','Pearl of Great Price']];

var BOOK_MAP={};
BOOKS.forEach(function(b,i){
  var names=[b[2].toLowerCase().replace(/—/g,'-')];
  if(b[3]){
    // aliases: split on spaces but keep multi-word groups — rebuild from known patterns
    var parts=b[3].split(' '),acc=[];
    for(var k=0;k<parts.length;k++){
      var w=parts[k];
      if(/^[1-4]$/.test(w)&&parts[k+1]){acc.push(w+' '+parts[k+1]);k++;continue;}
      if(w==='song'&&parts[k+1]==='of'){acc.push('song of songs');k+=2;continue;}
      if((w==='w'||w==='a')&&parts[k+1]==='of'){acc.push(w+' of '+parts[k+2]);k+=2;continue;}
      if(w==='doctrine'){acc.push('doctrine and covenants');k+=2;continue;}
      if(w==='d'&&parts[k+1]==='and'){acc.push('d and c');k+=2;continue;}
      if(w==='joseph'){acc.push('joseph '+parts[k+1]);k++;continue;}
      acc.push(w);
    }
    names=names.concat(acc);
  }
  names.forEach(function(n){BOOK_MAP[n]=i;});
});
function normBook(s){return s.toLowerCase().replace(/[.]/g,'').replace(/[—–]/g,'-').replace(/\s+/g,' ').replace(/^([1-4])\s*([a-z])/,'$1 $2').trim();}
function parseRef(raw){
  var s=String(raw).trim();if(!s)return null;
  var m=s.match(/^(.+?)\s+(\d+)(?::\s*([\d][\d\s,\-–—]*))?\s*$/);
  if(!m)return {raw:s};
  var bi=BOOK_MAP[normBook(m[1])];if(bi==null)return {raw:s};
  var b=BOOKS[bi],ch=+m[2],vs=m[3]?m[3].trim():'';
  if(b[1]==='a-of-f'&&!vs){vs=String(ch);ch=1;}
  var v1=vs?parseInt(vs,10):null,v2=null;
  var r=vs.match(/^(\d+)\s*[-–—]\s*(\d+)/);if(r)v2=+r[2];
  var url='https://www.churchofjesuschrist.org/study/scriptures/'+b[0]+'/'+b[1]+'/'+ch+'?lang=eng'+(v1?'&id=p'+v1+(v2?'-p'+v2:'')+'#p'+v1:'');
  return {raw:s,work:b[0],bookIndex:bi,book:b[2],ch:ch,v:v1||0,label:b[2]+' '+ch+(vs?':'+vs.replace(/\s+/g,''):''),url:url};
}
function splitRefs(v){return String(v||'').split(/\n|;/).map(function(x){return x.trim();}).filter(Boolean);}

/* ── rich text ── */
function inline(s){
  s=s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,function(m,t,l){
    var e=entryByTitle(t.replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"'));
    return e?'<a class="wl" data-act="open" data-id="'+e.id+'">'+(l||t)+'</a>':'<span class="broken" title="No entry with this title yet">'+(l||t)+'</span>';
  });
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>');
  return s;
}
function rich(text){
  var lines=esc(text).split('\n'),html='',para=[],list=[];
  function fp(){if(para.length){html+='<p>'+inline(para.join('<br>'))+'</p>';para=[];}}
  function fl(){if(list.length){html+='<ul>'+list.map(function(l){return '<li>'+inline(l)+'</li>';}).join('')+'</ul>';list=[];}}
  lines.forEach(function(l){
    var m=l.match(/^\s*[-*•]\s+(.*)$/);
    if(m){fp();list.push(m[1]);}
    else if(!l.trim()){fp();fl();}
    else{fl();para.push(l);}
  });
  fp();fl();return '<div class="rich">'+html+'</div>';
}

/* ── filtering ── */
function filtered(){
  var q=($('q').value||'').trim().toLowerCase();
  var list=proj.entries.filter(function(e){
    if(st.section==='__none'){if(e.sectionId&&secById(e.sectionId))return false;}
    else if(st.section&&e.sectionId!==st.section)return false;
    if(st.type&&e.typeId!==st.type)return false;
    if(!st.showPrivate&&isPrivate(e)&&st.section!==e.sectionId)return false;
    if(st.tag&&(e.tags||[]).indexOf(st.tag)<0)return false;
    if(q){var hay=(e.title+' '+(e.tags||[]).join(' ')+' '+fieldText(e)).toLowerCase();
      if(q.split(/\s+/).some(function(w){return hay.indexOf(w)<0;}))return false;}
    return true;
  });
  list.sort(st.sort==='title'?function(a,b){return a.title.localeCompare(b.title);}:
            st.sort==='created'?function(a,b){return (b.createdAt||'').localeCompare(a.createdAt||'');}:
            function(a,b){return (b.updatedAt||'').localeCompare(a.updatedAt||'');});
  return list;
}

/* ── entry view ── */
function renderValue(f,v){
  if(v==null||v===''||(Array.isArray(v)&&!v.length))return '';
  switch(f.kind){
    case 'longtext':return rich(v);
    case 'list':return '<div class="refs">'+splitRefs(v).map(function(x){return '<span class="ref plain">'+inline(esc(x))+'</span>';}).join('')+'</div>';
    case 'refs':return '<div class="refs">'+splitRefs(v).map(function(x){var r=parseRef(x);
      return r&&r.url?'<a class="ref" href="'+esc(r.url)+'" target="_blank" rel="noopener" title="Open in Gospel Library">'+esc(r.label)+' ↗</a>':'<span class="ref plain">'+esc(x)+'</span>';}).join('')+'</div>';
    case 'rating':return stars(v);
    case 'manuscript':return '<div class="manu-view">'+rich(v)+'</div><div class="mini">'+wc(v).toLocaleString()+' words</div>';
    case 'url':return '<a href="'+esc(/^https?:/i.test(v)?v:'https://'+v)+'" target="_blank" rel="noopener">'+esc(v)+'</a>';
    case 'when':return typeof v==='object'?esc(v.label||v.order):esc(v);
    case 'positions':
      if(!Array.isArray(v))return '';
      return v.map(function(p){return '<div class="pos"><h4>'+esc(p.name||'Position')+'</h4>'+
        (p.statement?'<div class="sub">As its supporters put it</div>'+rich(p.statement):'')+
        (p.evidence?'<div class="sub">Evidence &amp; arguments they cite</div>'+rich(p.evidence):'')+'</div>';}).join('');
    default:return '<div class="rich"><p>'+inline(esc(v))+'</p></div>';
  }
}
function backlinks(e){
  var out=[];
  proj.entries.forEach(function(o){if(o.id===e.id)return;
    var l=(o.links||[]).filter(function(x){return x.to===e.id;})[0];
    var mention=new RegExp('\\[\\['+e.title.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(\\||\\]\\])','i').test(fieldText(o));
    if(l||mention)out.push({e:o,label:l?l.label:'mentions'});});
  return out;
}

function startEdit(id,preset){
  if(id){var e=entryById(id);if(!e)return;draft=clone(e);draft._isNew=false;}
  else{
    var sec=preset&&preset.sectionId?secById(preset.sectionId):null;
    var typeId=(preset&&preset.typeId)||(sec&&sec.defaultType)||(P.defaultType)||proj.types[0].id;
    if(!sec&&P.typeSections&&P.typeSections[typeId])sec=secById(P.typeSections[typeId]);
    draft={id:uid(),typeId:typeId,sectionId:sec?sec.id:(proj.sections[0]?proj.sections[0].id:null),title:'',fields:{},tags:[],links:[],_isNew:true};
    prefill(draft);
  }
  go({view:'edit'});
}
function prefill(d){
  var t=typeById(d.typeId);if(!t)return;
  if((P.autoDateTypes||[]).indexOf(d.typeId)>=0){var df=t.fields.filter(function(f){return f.kind==='date';})[0];if(df&&!d.fields[df.id])d.fields[df.id]=todayKey();}
  if((P.autoTitleTypes||[]).indexOf(d.typeId)>=0&&!d.title)d.title=longDate();
}

function saveDraft(){
  readForm();
  if(!draft.title.trim()){toast('Give it a title first.');$('d_title').focus();return;}
  // tidy positions
  Object.keys(draft.fields).forEach(function(k){var v=draft.fields[k];if(Array.isArray(v))draft.fields[k]=v.filter(function(p){return p&&(p.name||p.statement||p.evidence);});});
  var isNew=draft._isNew;delete draft._isNew;
  var old=isNew?null:entryById(draft.id),delta=entryWords(draft)-(old?entryWords(old):0);
  if(delta){proj.meta.wordLog=proj.meta.wordLog||{};var tk=todayKey();proj.meta.wordLog[tk]=(proj.meta.wordLog[tk]||0)+delta;}
  draft.title=draft.title.trim();draft.updatedAt=now();
  if(isNew){draft.createdAt=draft.updatedAt;proj.entries.push(draft);}
  else{var i=proj.entries.findIndex(function(e){return e.id===draft.id;});if(i>=0)proj.entries[i]=draft;}
  var id=draft.id;draft=null;save();toast(isNew?'Entry created':'Saved');go({view:'entry',entry:id});
}
function deleteEntry(id){
  var i=proj.entries.findIndex(function(e){return e.id===id;});if(i<0)return;
  var e=proj.entries.splice(i,1)[0];e.deletedAt=now();proj.trash.unshift(e);
  if(proj.trash.length>100)proj.trash.length=100;
  draft=null;save();toast('Moved to Trash');go({view:'list'});
}

/* ── scripture index ── */
function renderScripture(){
  var hits=[],unknown=[];
  proj.entries.forEach(function(e){typeOf(e).fields.forEach(function(f){if(f.kind!=='refs')return;
    splitRefs(e.fields[f.id]).forEach(function(x){var r=parseRef(x);if(r&&r.work)hits.push({r:r,e:e});else unknown.push({raw:x,e:e});});});});
  var h='<div class="list-head"><h1>Scripture index</h1></div><p class="list-desc">Every scripture reference in your entries, in canonical order. Tap a reference to open it in Gospel Library, or an entry name to open your notes.</p>';
  if(!hits.length&&!unknown.length){$('main').innerHTML=h+'<div class="empty"><h3>No references yet</h3><p>Add scriptures to an entry’s scripture fields, one per line, like “Alma 32:21”.</p></div>';return;}
  WORKS.forEach(function(w){
    var inWork=hits.filter(function(x){return x.r.work===w[0];});if(!inWork.length)return;
    h+='<div class="si-work"><h2>'+esc(w[1])+'</h2>';
    var books={};inWork.forEach(function(x){(books[x.r.bookIndex]=books[x.r.bookIndex]||[]).push(x);});
    Object.keys(books).map(Number).sort(function(a,b){return a-b;}).forEach(function(bi){
      var refs={};books[bi].forEach(function(x){var k=x.r.label;(refs[k]=refs[k]||{r:x.r,es:[]}).es.push(x.e);});
      var arr=Object.keys(refs).map(function(k){return refs[k];}).sort(function(a,b){return a.r.ch-b.r.ch||a.r.v-b.r.v;});
      h+='<div class="si-book"><div class="si-book-name">'+esc(BOOKS[bi][2])+'</div><div class="si-refs">'+arr.map(function(x){
        var seen={};return '<div class="si-ref"><a class="ref" href="'+esc(x.r.url)+'" target="_blank" rel="noopener">'+esc(x.r.label)+' ↗</a>'+
          x.es.filter(function(e){if(seen[e.id])return false;seen[e.id]=1;return true;}).map(function(e){return '<span class="ent" data-act="open" data-id="'+e.id+'">'+esc(e.title)+'</span>';}).join(' · ')+'</div>';}).join('')+'</div></div>';
    });
    h+='</div>';
  });
  if(unknown.length)h+='<div class="si-work"><h2>Other references</h2><p class="mini">These didn’t match a book of scripture. Check the spelling, e.g. “1 Ne. 3:7” or “D&amp;C 76:22”.</p>'+unknown.map(function(x){return '<div class="si-ref"><span class="ref plain">'+esc(x.raw)+'</span><span class="ent" data-act="open" data-id="'+x.e.id+'">'+esc(x.e.title)+'</span></div>';}).join('')+'</div>';
  $('main').innerHTML=h;
}

/* ── Archive export ── */
function archiveItems(scope,secId){
  var since=proj.meta.lastArchiveExportAt||'';
  return proj.entries.filter(function(e){
    if(isPrivate(e))return false;
    if(scope==='section')return e.sectionId===secId;
    if(scope==='changed')return !since||(e.updatedAt||'')>since;
    return true;
  }).map(function(e){
    var t=typeOf(e),s=secById(e.sectionId),parts=[],refTags=[];
    t.fields.forEach(function(f){
      var v=e.fields[f.id];if(v==null||v===''||(Array.isArray(v)&&!v.length))return;
      var txt;
      if(f.kind==='positions')txt=v.map(function(p){return '• '+(p.name||'Position')+(p.statement?'\n  As its supporters put it: '+p.statement:'')+(p.evidence?'\n  Evidence they cite: '+p.evidence:'');}).join('\n\n');
      else if(f.kind==='when')txt=v.label||String(v.order);
      else if(f.kind==='refs'){var rs=splitRefs(v);txt=rs.join('; ');rs.forEach(function(x){var r=parseRef(x);refTags.push(r&&r.label?r.label:x);});}
      else if(f.kind==='list')txt=splitRefs(v).join('; ');
      else if(f.kind==='rating')txt=v+' of 5 stars';
      else txt=String(v);
      parts.push(f.label.toUpperCase()+'\n'+txt.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,function(m,a,b){return b||a;}));
    });
    var rel=(e.links||[]).map(function(l){var o=entryById(l.to);return o?o.title+(l.label?' ('+l.label+')':''):null;}).filter(Boolean);
    if(rel.length)parts.push('RELATED\n'+rel.join('; '));
    var tags=(e.tags||[]).concat(['from '+P.shortName,t.name]).concat(refTags).filter(function(x,i,a){return x&&a.indexOf(x)===i;});
    return {id:P.appKey+'-'+e.id,source:P.appKey,title:e.title,
      category:s?(s.group?s.group+': ':'')+s.name:P.shortName,
      tags:tags,content:parts.join('\n\n'),updatedAt:e.updatedAt||now()};
  });
}

/* ── special views (enabled per app via PRESET.views) ── */
var VIEWS={
  manuscript:{icon:'✎',label:'Manuscript'},
  journal:{icon:'📅',label:'Journal'},
  reading:{icon:'📚',label:'Reading shelf'}
};
function statBox(label,value,sub){return '<div class="stat"><div class="stat-v">'+value+'</div><div class="stat-l">'+label+'</div>'+(sub?'<div class="stat-s">'+sub+'</div>':'')+'</div>';}
function bar(pct){pct=Math.max(0,Math.min(100,pct));return '<div class="bar"><span style="width:'+pct.toFixed(1)+'%"></span></div>';}

/* Manuscript: scenes in story order, grouped by chapter, with word counts and goals */
function manuscriptScenes(){
  var T=typeById(P.manuscriptType);if(!T)return null;
  var chF=T.fields.filter(function(f){return f.id===P.chapterField;})[0];
  var stF=T.fields.filter(function(f){return f.id===P.statusField;})[0];
  var list=proj.entries.filter(function(e){return e.typeId===T.id&&visible(e);}).map(function(e){return {e:e,w:whenOf(e)};});
  list.sort(function(a,b){
    if(a.w&&b.w)return a.w.key-b.w.key;if(a.w)return -1;if(b.w)return 1;
    return (a.e.createdAt||'').localeCompare(b.e.createdAt||'');});
  return {T:T,chF:chF,stF:stF,list:list};
}
function renderManuscript(){
  var M=manuscriptScenes();
  if(!M){$('main').innerHTML='<div class="empty"><h3>No scene type in this project</h3><p>The Manuscript view works with projects made from the Novel or Short stories templates.</p></div>';return;}
  var log=proj.meta.wordLog||{},today=log[todayKey()]||0,goal=proj.meta.goalWords||0,daily=proj.meta.dailyGoal||0;
  var total=M.list.reduce(function(n,x){return n+entryWords(x.e);},0);
  var h='<div class="list-head"><h1>Manuscript</h1><div class="list-tools"><button class="btn sm" data-act="compile"'+(M.list.length?'':' disabled')+'>Compile to file</button><button class="btn sm pri" data-act="new-typed" data-type="'+M.T.id+'">＋ New '+esc(M.T.name.toLowerCase())+'</button></div></div>';
  h+='<div class="stats">'+
    statBox('Total words',total.toLocaleString(),goal?Math.round(total/goal*100)+'% of '+goal.toLocaleString()+bar(total/goal*100):'Set a goal below')+
    statBox('Written today',(today>0?'+':'')+today.toLocaleString(),daily?(today>=daily?'Daily goal reached ✓':(daily-today).toLocaleString()+' to go')+bar(today/daily*100):'Set a daily goal below')+
    statBox(esc(M.T.name)+'s',M.list.length,M.stF?statusSummary(M):'')+'</div>';
  // last 14 days
  var days=[],mx=1;for(var i=13;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=dkey(d),v=Math.max(0,log[k]||0);mx=Math.max(mx,v);days.push({d:d,v:v});}
  h+='<div class="spark" title="Words written per day, last 14 days">'+days.map(function(x){return '<div class="sp" title="'+esc(x.d.toLocaleDateString())+': '+x.v+' words"><span style="height:'+(x.v/mx*100)+'%"></span></div>';}).join('')+'</div><div class="mini" style="margin:-4px 0 14px">Words added per day, last 14 days</div>';
  h+='<div class="set-row" style="margin-bottom:18px"><label class="mini">Manuscript goal <input class="inp" type="number" min="0" step="1000" style="width:120px;display:inline-block" data-meta="goalWords" value="'+(goal||'')+'" placeholder="e.g. 80000"></label><label class="mini">Daily goal <input class="inp" type="number" min="0" step="50" style="width:100px;display:inline-block" data-meta="dailyGoal" value="'+(daily||'')+'" placeholder="e.g. 500"></label></div>';
  if(!M.list.length){$('main').innerHTML=h+'<div class="empty"><h3>No '+esc(M.T.name.toLowerCase())+'s yet</h3><p>Each one has a summary, a status and a writing area. Give them a story order number to arrange them.</p></div>';return;}
  var chapters=[],byCh={};
  M.list.forEach(function(x){var c=M.chF?String(x.e.fields[M.chF.id]||'').trim():'';if(!(c in byCh)){byCh[c]=[];chapters.push(c);}byCh[c].push(x);});
  chapters.forEach(function(c){
    var cw=byCh[c].reduce(function(n,x){return n+entryWords(x.e);},0);
    h+='<div class="ms-ch"><div class="ms-ch-h"><span>'+esc(c?(/^\d+$/.test(c)?'Chapter '+c:c):'No chapter')+'</span><span class="mini">'+cw.toLocaleString()+' words</span></div>';
    byCh[c].forEach(function(x){var e=x.e,w=entryWords(e),stv=M.stF?e.fields[M.stF.id]:'';
      h+='<div class="ms-row" data-act="open" data-id="'+e.id+'"><span class="ms-o">'+esc(x.w?x.w.label:'–')+'</span><span class="ms-t">'+esc(e.title)+'</span>'+(stv?'<span class="chip">'+esc(stv)+'</span>':'')+'<span class="ms-w">'+w.toLocaleString()+'</span></div>';});
    h+='</div>';
  });
  $('main').innerHTML=h;
}
function statusSummary(M){
  var c={};M.list.forEach(function(x){var v=x.e.fields[M.stF.id]||'No status';c[v]=(c[v]||0)+1;});
  return Object.keys(c).map(function(k){return esc(k)+' '+c[k];}).join(' · ');
}
function compileManuscript(){
  var M=manuscriptScenes();if(!M||!M.list.length)return;
  var mf=M.T.fields.filter(function(f){return f.kind==='manuscript';})[0];
  var parts=[],cur=null,total=0;
  M.list.forEach(function(x){
    var c=M.chF?String(x.e.fields[M.chF.id]||'').trim():'';
    if(!parts.length||c!==cur){cur=c;parts.push({c:c,scenes:[]});}
    var t=mf?String(x.e.fields[mf.id]||'').trim():'';total+=wc(t);
    parts[parts.length-1].scenes.push((P.compileSceneTitles?'## '+x.e.title+'\n\n':'')+(t||'['+x.e.title+' — not written yet]'));
  });
  var out=proj.name.toUpperCase()+'\n\n'+parts.map(function(p){
    return (p.c?(/^\d+$/.test(p.c)?'CHAPTER '+p.c:p.c.toUpperCase())+'\n\n':'')+p.scenes.join('\n\n* * *\n\n');
  }).join('\n\n\n')+'\n';
  BackupLinks.shareOrDownload(out,slug(proj.name)+'-manuscript-'+todayKey()+'.txt','text/plain').then(function(r){if(r!=='cancelled')toast('Compiled '+total.toLocaleString()+' words');});
}

/* Journal: entries by month, today's entry, streak, on this day */
function journalEntries(){return proj.entries.filter(function(e){return (P.journalTypes||[]).indexOf(e.typeId)>=0&&visible(e);});}
function todaysJournal(){var k=todayKey();return proj.entries.filter(function(e){return e.typeId===P.journalTypes[0]&&fieldOf(e,'date')===k;})[0];}
function renderJournal(){
  var all=journalEntries().map(function(e){return {e:e,d:dateOf(e)};}).filter(function(x){return x.d;});
  all.sort(function(a,b){return b.d-a.d||(b.e.createdAt||'').localeCompare(a.e.createdAt||'');});
  var days={};all.forEach(function(x){days[dkey(x.d)]=1;});
  var streak=0,d=new Date();if(!days[dkey(d)])d.setDate(d.getDate()-1);
  while(days[dkey(d)]){streak++;d.setDate(d.getDate()-1);}
  var yr=new Date().getFullYear(),thisYear=all.filter(function(x){return x.d.getFullYear()===yr;}).length;
  var te=todaysJournal(),jt=typeById(P.journalTypes[0]);
