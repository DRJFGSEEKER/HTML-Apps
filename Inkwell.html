    '<button class="btn pri" data-act="today">'+(te?'Open today’s entry':'✎ Write today’s entry')+'</button></div></div>';
  h+='<div class="stats">'+statBox('Day streak',streak,streak?'Keep it going':'Write today to start one')+statBox('Entries in '+yr,thisYear,'')+statBox('All entries',all.length,'')+'</div>';
  if(prompts.length&&!te&&jt)h+='<div class="prompt"><span class="mini">Today’s prompt</span><div>'+esc(prompts[doy%prompts.length])+'</div></div>';
  var md=todayKey().slice(5),past=all.filter(function(x){return dkey(x.d).slice(5)===md&&x.d.getFullYear()<yr;});
  if(past.length)h+='<div class="otd"><div class="fld-label">On this day</div>'+past.map(function(x){return '<div class="lnk" data-act="open" data-id="'+x.e.id+'"><span class="lnk-l">'+x.d.getFullYear()+'</span><span class="lnk-t">'+esc(x.e.title)+'</span></div>';}).join('')+'</div>';
  if(!all.length){$('main').innerHTML=h+'<div class="empty"><h3>Your journal is empty</h3><p>Tap “Write today’s entry” to begin. Today’s date is filled in for you.</p></div>';return;}
  var cur='';
  all.forEach(function(x){
    var m=x.d.toLocaleDateString(undefined,{month:'long',year:'numeric'});
    if(m!==cur){if(cur)h+='</div>';cur=m;h+='<div class="j-month"><div class="j-mh">'+esc(m)+'</div>';}

  });
  h+='</div>';
  $('main').innerHTML=h;
}

    document.documentElement.style.setProperty('--accent-soft',hexA(a,.14));document.documentElement.style.setProperty('--accent-line',hexA(a,.45));}

}
function hexA(h,a){var m=/^#?([0-9a-f]{6})$/i.exec(h);if(!m)return h;var n=parseInt(m[1],16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';}

  proj=p;root.activeProject=id;save();go({view:'list',section:null,type:null,tag:null,entry:null});
}

/* ── events ── */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  if(st.view==='edit'&&draft&&/^(link-|pos-)/.test(a))readForm();
  switch(a){
    case 'menu':openMenu();break;case 'menu-close':closeMenu();break;
    case 'home':case 'all':go({view:'list',section:null,type:null,tag:null});break;
    case 'view':go({view:b.getAttribute('data-v')});break;
    case 'section':go({view:'list',section:id,type:null});break;
    case 'type':go({view:'list',type:id,section:null});break;
    case 'type-in-sec':go({view:'list',type:id,noScroll:true});break;
    case 'type-clear':go({view:'list',type:null,noScroll:true});break;
    case 'tag':go({view:'list',tag:b.getAttribute('data-tag'),section:null,type:null});break;
    case 'tag-clear':go({view:'list',tag:null,noScroll:true});break;
    case 'open':go({view:'entry',entry:id});break;
    case 'new':startEdit(null,{sectionId:st.view==='list'&&st.section&&st.section!=='__none'?st.section:null,typeId:st.view==='list'&&st.type?st.type:null});break;
    case 'edit':startEdit(id);break;
    case 'save':saveDraft();break;
    case 'cancel':var back=draft&&!draft._isNew?draft.id:null;draft=null;go(back?{view:'entry',entry:back}:{view:'list'});break;
    case 'delete':armOrRun(b,function(){deleteEntry(draft.id);});break;
    case 'link-add':var to=$('d_linkTo').value;if(to){draft.links=draft.links||[];draft.links.push({to:to,label:''});renderEdit();}break;
    case 'link-del':draft.links.splice(+b.getAttribute('data-i'),1);renderEdit();break;
    case 'pos-add':{var f=b.getAttribute('data-f');if(!Array.isArray(draft.fields[f]))draft.fields[f]=[];draft.fields[f].push({name:'',statement:'',evidence:''});renderEdit();break;}
    case 'pos-del':{var f2=b.getAttribute('data-f');draft.fields[f2].splice(+b.getAttribute('data-i'),1);renderEdit();break;}
    case 'trash-restore':{var e=proj.trash.splice(+b.getAttribute('data-i'),1)[0];delete e.deletedAt;e.updatedAt=now();proj.entries.push(e);save();toast('Restored');render();break;}
    case 'trash-del':armOrRun(b,function(){proj.trash.splice(+b.getAttribute('data-i'),1);save();render();});break;
    case 'trash-empty':armOrRun(b,function(){proj.trash=[];save();render();});break;
    case 'tab':st.tab=b.getAttribute('data-t');renderSettings();break;
    case 'quick-section':{var g=b.getAttribute('data-group'),q=(P.quickAdd||[]).filter(function(x){return x.group===g;})[0];
      var s={id:uid(),name:q.newName||'New section',group:g,icon:q.icon||'·',description:q.description||'',defaultType:q.defaultType||''};
      proj.sections.push(s);save();st.tab='sections';go({view:'settings'});
      setTimeout(function(){var el=document.querySelector('[data-sec="'+s.id+'"][data-p="name"]');if(el){el.scrollIntoView({block:'center'});el.focus();el.select();}},50);break;}
    case 'sec-add':{var nm=$('newSecName').value.trim();if(!nm){$('newSecName').focus();return;}
      proj.sections.push({id:uid(),name:nm,group:$('newSecGroup').value.trim(),icon:'·',description:'',defaultType:''});save();render();toast('Section added');break;}
    case 'sec-up':case 'sec-down':{var i=proj.sections.findIndex(function(s){return s.id===id;}),g2=proj.sections[i].group||'',d=a==='sec-up'?-1:1,j=i+d;
      while(j>=0&&j<proj.sections.length&&(proj.sections[j].group||'')!==g2)j+=d;
      if(j>=0&&j<proj.sections.length){var tmp=proj.sections[i];proj.sections[i]=proj.sections[j];proj.sections[j]=tmp;save();render();}break;}
    case 'sec-del':armOrRun(b,function(){proj.sections=proj.sections.filter(function(s){return s.id!==id;});proj.entries.forEach(function(e){if(e.sectionId===id)e.sectionId=null;});
      if(st.section===id)st.section=null;save();render();toast('Section deleted. Its entries are in Unsorted.');});break;
    case 'type-toggle':st.openType=st.openType===id?null:id;renderSettings();break;
    case 'type-add':{var tn=$('newTypeName').value.trim();if(!tn){$('newTypeName').focus();return;}
      var nt={id:'t'+uid(),name:tn,icon:$('newTypeIcon').value.trim()||'📝',color:'#8a9bb0',fields:[{id:'notes',label:'Notes',kind:'longtext'}]};
      proj.types.push(nt);st.openType=nt.id;save();render();break;}
    case 'type-del':armOrRun(b,function(){proj.types=proj.types.filter(function(t){return t.id!==id;});save();render();});break;
    case 'fld-add':{var tt=typeById(b.getAttribute('data-type'));tt.fields.push({id:'f'+uid(),label:'New field',kind:'text'});save();renderSettings();
      setTimeout(function(){var all=document.querySelectorAll('[data-type="'+tt.id+'"][data-p="label"]');var el=all[all.length-1];if(el){el.focus();el.select();}},30);break;}
    case 'fld-del':{var t3=typeById(b.getAttribute('data-type'));armOrRun(b,function(){t3.fields.splice(+b.getAttribute('data-i'),1);save();renderSettings();});break;}
    case 'fld-up':{var t4=typeById(b.getAttribute('data-type')),k=+b.getAttribute('data-i');if(k>0){var x=t4.fields[k];t4.fields[k]=t4.fields[k-1];t4.fields[k-1]=x;save();renderSettings();}break;}
    case 'accent-reset':root.settings.accent=null;save();render();break;
    case 'proj-open':switchProject(id);break;
    case 'proj-add':{var pn=$('newProjName').value.trim()||'Untitled project';var np=makeProject(pn,$('newProjTpl').value);root.projects.push(np);switchProject(np.id);toast('Project created');break;}
    case 'proj-dup':{var src=root.projects.filter(function(p){return p.id===id;})[0];
      var cp={id:uid(),name:src.name+' (copy)',template:src.template,sections:clone(src.sections),types:clone(src.types),entries:[],trash:[],meta:{}};
      root.projects.push(cp);save();render();toast('New project with the same setup');break;}
    case 'proj-del':armOrRun(b,function(){root.projects=root.projects.filter(function(p){return p.id!==id;});if(proj.id===id)proj=root.projects[0];root.activeProject=proj.id;save();render();toast('Project deleted');});break;
    case 'backups':backups.open();break;
    case 'undo-restore':armOrRun(b,function(){
      try{var prev=localStorage.getItem(KEY+'_before_restore');if(!prev)throw 0;localStorage.setItem(KEY,prev);localStorage.removeItem(KEY+'_before_restore');localStorage.removeItem(KEY+'_before_restore_meta');
        load();go({view:'list',section:null,type:null,tag:null});toast('Restored your earlier data');}catch(e){toast('Nothing to undo.');}});break;
    case 'archive-export':openArchiveExport();break;
    case 'archive-go':doArchiveExport();break;
    case 'wiki-export':wikiExport();break;
    case 'modal-close':closeModal();break;
    case 'toggle-private':st.showPrivate=!st.showPrivate;render();toast(st.showPrivate?'Showing private entries':'Private entries hidden');break;
    case 'new-typed':startEdit(null,{typeId:b.getAttribute('data-type'),sectionId:b.getAttribute('data-sec')||null});break;
    case 'today':{var te=todaysJournal();if(te)go({view:'entry',entry:te.id});else startEdit(null,{typeId:P.journalTypes[0]});break;}
    case 'compile':compileManuscript();break;
    case 'spot-next':renderReading();break;
  }
});
document.addEventListener('change',function(ev){
  var el=ev.target,ac=el.getAttribute('data-act-change');
  if(ac==='sort'){st.sort=el.value;renderList();return;}
  if(ac==='tl-sec'){st.tlSection=el.value||null;renderTimeline();return;}
  if(ac==='draft-type'){readForm();draft.typeId=el.value;if(draft._isNew)prefill(draft);renderEdit();return;}
  if(el.id==='projSel'){switchProject(el.value);return;}
  if(el.hasAttribute('data-meta')){proj.meta[el.getAttribute('data-meta')]=Math.max(0,+el.value||0);save();render();return;}
  var p=el.getAttribute('data-p'),v=el.type==='checkbox'?el.checked:el.value;
  if(el.hasAttribute('data-set')){root.settings[el.getAttribute('data-set')]=v;save();applyBrand();return;}
  if(el.hasAttribute('data-sec')){var s=secById(el.getAttribute('data-sec'));if(s){s[p]=v;save();renderSide();if(p==='group'||p==='private')renderSettings();}return;}
  if(el.hasAttribute('data-type')){var t=typeById(el.getAttribute('data-type'));if(!t)return;
    if(el.hasAttribute('data-field')){var f=t.fields.filter(function(x){return x.id===el.getAttribute('data-field');})[0];if(f){f[p]=v;save();if(p==='kind')renderSettings();}}
    else{t[p]=v;save();renderSide();}return;}
  if(el.hasAttribute('data-proj')){var pr=root.projects.filter(function(x){return x.id===el.getAttribute('data-proj');})[0];if(pr){pr.name=v.trim()||pr.name;save();applyBrand();}}
});
document.addEventListener('input',function(e){var t=e.target;if(t.classList&&t.classList.contains('manu')){var c=t.parentNode.querySelector('.wcount');if(c)c.textContent=wc(t.value).toLocaleString()+' words';}});
$('q').addEventListener('input',function(){
  if(st.view==='timeline'){renderTimeline();return;}
  if(this.value.trim()&&(st.section||st.type||st.tag)){st.section=null;st.type=null;st.tag=null;}
  if(st.view!=='list')st.view='list';
  renderSide();renderList();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if($('modal').classList.contains('on'))closeModal();else closeMenu();}
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('q').focus();}
  if((e.ctrlKey||e.metaKey)&&e.key==='s'&&st.view==='edit'){e.preventDefault();saveDraft();}
});
$('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeModal();});
window.addEventListener('beforeunload',function(e){if(st.view==='edit'&&draft){readForm();if(draft.title||Object.keys(draft.fields).length){e.preventDefault();e.returnValue='';}}});

/* ── boot ── */
load();save();
var backups=BackupLinks.init({
  appKey:P.appKey,appName:P.title,filePrefix:P.appKey+'-backup',driveFolderName:P.title+' Backups',
  getJSON:function(){return JSON.stringify(root,null,2);},
  restoreMode:'replace',
  restoreWarning:'This replaces everything in '+P.title+(P.multiProject?', all projects included,':'')+' with the backup. Your current data is kept so you can undo it from Settings → Backups & export.',
  restore:function(text){
    var r;try{r=JSON.parse(text);}catch(e){throw new Error('That file isn’t valid JSON.');}
    if(!isRoot(r))throw new Error('That file isn’t a '+P.title+' backup.'+(Array.isArray(r)?' (It looks like an Archive file.)':''));
    var kept=false;
    try{localStorage.setItem(KEY+'_before_restore',JSON.stringify(root));localStorage.setItem(KEY+'_before_restore_meta',JSON.stringify({at:Date.now()}));kept=true;}catch(e){}
    localStorage.setItem(KEY,JSON.stringify(r));
    load();go({view:'list',section:null,type:null,tag:null,entry:null});
    return 'Restored.'+(kept?' You can undo this from Settings → Backups & export.':'');
  },
  footNote:'Backups contain all your data. Restoring replaces what’s here, and you can undo the most recent restore.',
  theme:P.backupTheme
});
render();
window.__app={get root(){return root;},get proj(){return proj;},go:go,parseRef:parseRef,archiveItems:archiveItems};
})();

</script>
