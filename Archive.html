<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE ARCHIVE — Personal Knowledge Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Spectral+SC:wght@600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12140f;
    --panel: #1a1d14;
    --panel-alt: #21261a;
    --card: #1e2317;
    --line: rgba(238,231,216,0.10);
    --line-strong: rgba(238,231,216,0.20);
    --text: #eee7d8;
    --text-dim: #a3a68c;
    --text-faint: #666a52;
    --brass: #c9a253;
    --brass-dim: rgba(201,162,83,0.15);
    --moss: #8ba06a;
    --moss-dim: rgba(139,160,106,0.18);
    --rust: #b6603f;
    --rust-dim: rgba(182,96,63,0.15);
    --font-display: 'Spectral', serif;
    --font-caps: 'Spectral SC', serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--bg); color-scheme:dark;}
  body{
    background:
      radial-gradient(ellipse 1000px 500px at 15% -5%, rgba(139,160,106,0.07), transparent),
      radial-gradient(ellipse 800px 500px at 100% 20%, rgba(201,162,83,0.05), transparent),
      var(--bg);
    color:var(--text); font-family:var(--font-body); min-height:100vh; padding-bottom:60px;
  }
  ::selection{background:var(--brass); color:#12140f;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 24px;}

  header.top{border-bottom:1px solid var(--line); padding:30px 0 22px;}
  .top-row{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap;}
  .brand-mark{font-family:var(--font-caps); font-weight:600; font-size:28px; letter-spacing:2px;}
  .brand-mark .dot{color:var(--brass);}
  .brand-sub{font-family:var(--font-mono); font-size:11px; color:var(--text-faint); letter-spacing:1.5px; text-transform:uppercase; margin-top:4px;}
  .count-block{text-align:right; font-family:var(--font-mono); font-size:12px; color:var(--text-dim);}
  .count-block b{color:var(--brass); font-size:20px; display:block; font-family:var(--font-display);}

  .toolbar{margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  input[type=text], textarea{
    background:var(--panel); border:1px solid var(--line-strong); color:var(--text);
    font-family:var(--font-body); font-size:14px; padding:10px 13px; border-radius:5px; outline:none;
  }
  input[type=text]:focus, textarea:focus{border-color:var(--brass);}
  input[type=text]::placeholder, textarea::placeholder{color:var(--text-faint);}
  #searchInput{flex:1; min-width:220px; font-family:var(--font-mono); font-size:13px;}

  button{
    font-family:var(--font-mono); font-size:12px; letter-spacing:0.4px; text-transform:uppercase;
    background:var(--panel-alt); color:var(--text); border:1px solid var(--line-strong);
    padding:10px 15px; border-radius:5px; cursor:pointer; transition:border-color .15s, color .15s;
  }
  button:hover{border-color:var(--brass); color:var(--brass);}
  button:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--brass); outline-offset:1px;}
  button.primary{background:var(--brass-dim); border-color:var(--brass); color:var(--brass); font-weight:600;}
  button.danger{background:var(--rust-dim); border-color:var(--rust); color:var(--rust);}
  button.danger.armed{
    background:var(--rust); border-color:var(--rust); color:#fff; font-weight:600;
    animation:delete-pulse 0.9s ease-in-out infinite;
  }
  @keyframes delete-pulse{0%,100%{opacity:1;} 50%{opacity:.6;}}
  button.ghost{background:transparent;}

  .chips{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.5px; padding:6px 12px; border-radius:20px;
    border:1px solid var(--line-strong); color:var(--text-dim); cursor:pointer; background:var(--panel);
    transition:all .15s;
  }
  .chip:hover{border-color:var(--moss); color:var(--moss);}
  .chip.active{background:var(--moss-dim); border-color:var(--moss); color:var(--moss); font-weight:600;}

  /* ---------- card grid ---------- */
  .grid{margin-top:26px; display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px;}

  .card{
    background:var(--card); border:1px solid var(--line); border-left:3px solid var(--moss);
    border-radius:6px; padding:16px 18px; cursor:pointer; position:relative;
    display:flex; flex-direction:column; gap:8px; min-height:150px;
    transition:border-color .15s, transform .1s;
  }
  .card:hover{border-color:var(--line-strong); border-left-color:var(--brass);}
  .card .cat-no{
    position:absolute; top:12px; right:14px; font-family:var(--font-mono); font-size:10px; color:var(--text-faint);
  }
  .card h3{
    font-family:var(--font-display); font-weight:600; font-size:17px; line-height:1.3; padding-right:40px;
  }
  .card .tag-row{display:flex; gap:6px; flex-wrap:wrap;}
  .card .cat-tag{
    font-family:var(--font-mono); font-size:10px; letter-spacing:0.5px; text-transform:uppercase;
    color:var(--moss); background:var(--moss-dim); padding:2px 8px; border-radius:10px;
  }
  .card .snippet{font-size:13px; color:var(--text-dim); line-height:1.5; flex:1;}
  .card .meta{font-family:var(--font-mono); font-size:10px; color:var(--text-faint); margin-top:auto; padding-top:6px; border-top:1px solid var(--line);}

  .empty-state{
    margin-top:40px; text-align:center; padding:60px 20px; border:1px dashed var(--line-strong); border-radius:10px;
  }
  .empty-state .glyph{font-family:var(--font-display); font-size:40px; color:var(--text-faint);}
  .empty-state p{font-family:var(--font-mono); font-size:13px; color:var(--text-dim); margin-top:10px;}

  .loading-row{font-family:var(--font-mono); font-size:12px; color:var(--text-dim); margin-top:26px;}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,11,7,0.75); backdrop-filter:blur(2px);
    display:flex; align-items:flex-start; justify-content:center; padding:6vh 20px; z-index:50; overflow-y:auto;
  }
  .overlay.hidden{display:none;}
  .modal{
    background:var(--panel); border:1px solid var(--line-strong); border-radius:10px; max-width:640px; width:100%;
    padding:26px 28px; margin-bottom:6vh;
  }
  .modal h2{font-family:var(--font-display); font-weight:600; font-size:22px; margin-bottom:18px;}
  .field{margin-bottom:14px; display:flex; flex-direction:column; gap:6px;}
  .field label{font-family:var(--font-mono); font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-faint);}
  .field input, .field textarea{width:100%; font-size:14px;}
  .field textarea{min-height:160px; resize:vertical; line-height:1.6; font-family:var(--font-body);}
  .modal-actions{display:flex; justify-content:space-between; margin-top:20px; gap:10px;}
  .modal-actions .left{display:flex; gap:10px;}

  /* ---------- view modal ---------- */
  .view-modal .view-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px;}
  .view-modal h2{margin-bottom:6px;}
  .view-modal .tag-row{margin-bottom:16px;}
  .view-modal .content-body{
    font-family:var(--font-display); font-size:15px; line-height:1.75; color:var(--text); white-space:pre-wrap;
  }
  .view-modal .meta-line{font-family:var(--font-mono); font-size:11px; color:var(--text-faint); margin-top:20px; padding-top:14px; border-top:1px solid var(--line);}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--panel-alt);
    border:1px solid var(--brass); color:var(--brass); font-family:var(--font-mono); font-size:12px;
    padding:10px 18px; border-radius:6px; z-index:60; opacity:0; transition:opacity .25s; pointer-events:none;
  }
  .toast.show{opacity:1;}

  footer{
    margin-top:36px; padding-top:20px; border-top:1px solid var(--line);
    font-family:var(--font-mono); font-size:11px; color:var(--text-faint); display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }

  @media (max-width:640px){
    .top-row{flex-direction:column; align-items:flex-start;}
    .count-block{text-align:left;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="top-row">
      <div>
        <div class="brand-mark">THE<span class="dot">·</span>ARCHIVE</div>
        <div class="brand-sub">A personal library of things worth remembering</div>
      </div>
      <div class="count-block">
        <b id="entryCount">0</b>entries catalogued
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search titles, tags, or content…">
      <button type="button" class="primary" id="newEntryBtn">+ New Entry</button>
      <button type="button" class="ghost" id="exportBtn">Export</button>
      <button type="button" class="ghost" id="importBtn">Import</button>
      <button type="button" class="ghost" id="linkedBackupBtn" title="Back up to a linked folder, Google Drive, or your share sheet">Backups</button>
    </div>

    <div class="chips" id="categoryChips"></div>
  </header>

  <div id="gridZone">
    <div class="loading-row">Opening the archive…</div>
  </div>

  <footer>
    <div>Stored locally in this browser only — clearing your browser data will erase it. Export regularly to back it up.</div>
    <div id="lastSaved">—</div>
  </footer>
</div>

<!-- Edit/New modal -->
<div class="overlay hidden" id="editOverlay">
  <div class="modal">
    <h2 id="editTitle">New Entry</h2>
    <div class="field">
      <label>Title</label>
      <input type="text" id="fTitle" placeholder="e.g. How to tie a bowline knot">
    </div>
    <div class="field">
      <label>Category</label>
      <input type="text" id="fCategory" placeholder="e.g. Skills, Science, Recipes, History…">
    </div>
    <div class="field">
      <label>Tags (comma separated)</label>
      <input type="text" id="fTags" placeholder="e.g. knots, sailing, outdoors">
    </div>
    <div class="field">
      <label>Content</label>
      <textarea id="fContent" placeholder="Write what you want to remember here…"></textarea>
    </div>
    <div class="modal-actions">
      <div class="left">
        <button type="button" class="primary" id="saveBtn">Save</button>
        <button type="button" class="ghost" id="cancelBtn">Cancel</button>
      </div>
      <button type="button" class="danger hidden" id="deleteBtn">Delete</button>
    </div>
  </div>
</div>

<!-- View modal -->
<div class="overlay hidden" id="viewOverlay">
  <div class="modal view-modal">
    <div class="view-head">
      <div>
        <h2 id="vTitle"></h2>
        <div class="tag-row" id="vTags"></div>
      </div>
    </div>
    <div class="content-body" id="vContent"></div>
    <div class="meta-line" id="vMeta"></div>
    <div class="modal-actions">
      <div class="left">
        <button type="button" id="vEditBtn">Edit</button>
        <button type="button" class="danger" id="vDeleteBtn">Delete</button>
      </div>
      <button type="button" class="ghost" id="vCloseBtn">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Export/Import modal -->
<div class="overlay hidden" id="dataOverlay">
  <div class="modal">
    <h2 id="dataModalTitle">Export Library</h2>
    <p id="dataModalDesc" style="font-family:var(--font-mono); font-size:12px; color:var(--text-dim); margin-bottom:14px; line-height:1.6;"></p>
    <div class="field">
      <textarea id="dataTextarea" style="min-height:280px; font-family:var(--font-mono); font-size:12px;" spellcheck="false"></textarea>
    </div>
    <input type="file" id="dataFileInput" accept="application/json" style="display:none;">
    <div class="modal-actions">
      <div class="left">
        <button type="button" class="primary" id="dataPrimaryBtn">Copy to Clipboard</button>
        <button type="button" class="ghost hidden" id="dataDownloadBtn">Download File</button>
        <button type="button" class="ghost hidden" id="dataLoadFileBtn">Load from File</button>
      </div>
      <button type="button" class="ghost" id="dataCloseBtn">Close</button>
    </div>
  </div>
</div>

<script>
/* ══ LINKED BACKUPS ══════════════════════════════════════════════════════════
   An add-on to the existing Export/Import — it doesn't replace or change them.
   Three destinations, each a one-button backup/restore once set up:
     • Share sheet / file   — any device. Sends a .json file to the OS share sheet
                              (pick Google Drive, Files, Dropbox…) or saves it.
     • Linked folder        — File System Access API (Chrome/Edge on desktop). The
                              folder choice is remembered in IndexedDB.
     • Google Drive         — Google Identity Services + Drive REST API, drive.file
                              scope (the app can only see files it created itself).
   Usage: BackupLinks.init({...config}) → returns { open() }.
   ═══════════════════════════════════════════════════════════════════════════ */
(function(){
  'use strict';

  var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
  var DRIVE_API = 'https://www.googleapis.com/drive/v3';
  var DRIVE_UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function pad(n){return (n<10?'0':'')+n;}
  function stamp(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());}
  function ago(ts){
    if(!ts)return 'never';
    var s=Math.round((Date.now()-ts)/1000);
    if(s<60)return 'just now';
    var m=Math.round(s/60); if(m<60)return m+' min ago';
    var h=Math.round(m/60); if(h<24)return h+(h===1?' hour ago':' hours ago');
    var d=Math.round(h/24); if(d<30)return d+(d===1?' day ago':' days ago');
    return new Date(ts).toLocaleDateString();
  }
  function fmtDate(ts){var d=new Date(ts);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+', '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
  function fmtSize(b){if(b==null||isNaN(b))return '';b=+b;if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(0)+' KB';return (b/1048576).toFixed(1)+' MB';}

  function init(cfg){
    var KEY = cfg.appKey + '_backuplinks';
    var DB  = cfg.appKey + '-backup-links';
    var t = cfg.theme || {};
    var st = loadSt();
    var folderHandle = null;        // FileSystemDirectoryHandle, restored from IndexedDB
    var folderSupported = typeof window.showDirectoryPicker === 'function';
    var accessToken = null, tokenExp = 0, gisPromise = null;
    var busy = '';                  // short message while an operation runs
    var notice = null;              // {kind:'ok'|'err', text}
    var listing = null;             // {source:'folder'|'drive', items:[...]} for restore picker
    var staged = null;              // {label, getText} pending a replace-confirm
    var armedId = null;             // tap-twice arming for destructive restores

    /* ── persisted settings ── */
    function loadSt(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
    function saveSt(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}

    /* ── IndexedDB (only place a folder handle can be remembered) ── */
    function idb(){
      return new Promise(function(res,rej){
        if(!window.indexedDB){rej(new Error('IndexedDB unavailable'));return;}
        var r=indexedDB.open(DB,1);
        r.onupgradeneeded=function(){r.result.createObjectStore('kv');};
        r.onsuccess=function(){res(r.result);};
        r.onerror=function(){rej(r.error);};
      });
    }
    function idbOp(mode,fn){
      return idb().then(function(db){return new Promise(function(res,rej){
        var tx=db.transaction('kv',mode),req=fn(tx.objectStore('kv'));
        tx.oncomplete=function(){res(req&&req.result);};
        tx.onerror=function(){rej(tx.error);};
      });});
    }
    function idbGet(k){return idbOp('readonly',function(s){return s.get(k);});}
    function idbSet(k,v){return idbOp('readwrite',function(s){return s.put(v,k);});}
    function idbDel(k){return idbOp('readwrite',function(s){return s.delete(k);});}

    /* ── styles ── */
    var css=
      '.blk-ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:'+(t.z||400)+';display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:5vh 14px;-webkit-overflow-scrolling:touch;}'+
      '.blk-ov.on{display:flex;}'+
      '.blk{background:'+t.panel+';color:'+t.text+';border:1px solid '+t.line+';border-radius:12px;width:100%;max-width:560px;padding:20px 20px 16px;font-family:'+t.body+';margin-bottom:5vh;}'+
      '.blk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px;}'+
      '.blk h2{font-family:'+t.head+';font-size:1.3rem;font-weight:600;color:'+t.accent+';margin:0;}'+
      '.blk-x{background:none;border:none;color:'+t.dim+';font-size:1.4rem;cursor:pointer;padding:2px 6px;line-height:1;}'+
      '.blk-status{font-size:.86rem;color:'+t.dim+';margin-bottom:14px;line-height:1.45;}'+
      '.blk-all{width:100%;margin-bottom:6px;}'+
      '.blk-sec{border-top:1px solid '+t.line+';padding:14px 0 12px;}'+
      '.blk-sec h3{font-family:'+t.head+';font-size:1rem;font-weight:600;margin:0 0 4px;color:'+t.text+';display:flex;align-items:center;gap:8px;}'+
      '.blk-dot{width:8px;height:8px;border-radius:50%;background:'+t.dim+';opacity:.5;flex-shrink:0;}'+
      '.blk-dot.on{background:'+t.ok+';opacity:1;box-shadow:0 0 0 3px '+t.okBg+';}'+
      '.blk-p{font-size:.86rem;color:'+t.dim+';line-height:1.5;margin:0 0 10px;}'+
      '.blk-p b{color:'+t.text+';font-weight:600;}'+
      '.blk-row{display:flex;flex-wrap:wrap;gap:8px;}'+
      '.blk-btn{font-family:'+t.btnFont+';font-size:'+t.btnSize+';letter-spacing:.06em;text-transform:'+(t.btnCase||'none')+';background:'+t.btnBg+';color:'+t.accent+';border:1px solid '+t.accentLine+';border-radius:6px;padding:9px 13px;min-height:38px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;}'+
      '.blk-btn:hover:not(:disabled){border-color:'+t.accent+';}'+
      '.blk-btn:focus-visible{outline:2px solid '+t.accent+';outline-offset:2px;}'+
      '.blk-btn.pri{background:'+t.accentBg+';border-color:'+t.accent+';font-weight:600;}'+
      '.blk-btn.quiet{background:transparent;color:'+t.dim+';border-color:'+t.line+';}'+
      '.blk-btn.danger{color:'+t.danger+';border-color:'+t.danger+';background:'+t.dangerBg+';}'+
      '.blk-btn.armed{background:'+t.danger+';color:#fff;border-color:'+t.danger+';}'+
      '.blk-btn:disabled{opacity:.4;cursor:default;}'+
      '.blk-note{font-size:.84rem;line-height:1.5;border-radius:8px;padding:10px 12px;margin:0 0 12px;}'+
      '.blk-note.ok{background:'+t.okBg+';color:'+t.ok+';border:1px solid '+t.ok+';}'+
      '.blk-note.err{background:'+t.dangerBg+';color:'+t.danger+';border:1px solid '+t.danger+';}'+
      '.blk-note.busy{background:'+t.accentBg+';color:'+t.accent+';border:1px solid '+t.accentLine+';}'+
      '.blk-note.warn{background:'+t.dangerBg+';color:'+t.text+';border:1px solid '+t.danger+';}'+
      '.blk-list{margin-top:10px;border:1px solid '+t.line+';border-radius:8px;overflow:hidden;}'+
      '.blk-li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-top:1px solid '+t.line+';}'+
      '.blk-li:first-child{border-top:none;}'+
      '.blk-li-name{font-family:'+t.mono+';font-size:.74rem;color:'+t.text+';word-break:break-all;}'+
      '.blk-li-meta{font-size:.76rem;color:'+t.dim+';margin-top:2px;}'+
      '.blk-list-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:.8rem;color:'+t.dim+';background:'+t.accentBg+';}'+
      '.blk-inp{width:100%;background:rgba(0,0,0,.25);border:1px solid '+t.line+';border-radius:6px;color:'+t.text+';font-family:'+t.mono+';font-size:.78rem;padding:9px 10px;margin-bottom:8px;}'+
      '.blk-inp:focus{outline:none;border-color:'+t.accent+';}'+
      '.blk details{margin-top:8px;font-size:.84rem;color:'+t.dim+';}'+
      '.blk summary{cursor:pointer;color:'+t.accent+';margin-bottom:6px;}'+
      '.blk ol{margin:6px 0 4px 1.2rem;padding:0;line-height:1.55;}'+
      '.blk ol li{margin-bottom:5px;}'+
      '.blk code{font-family:'+t.mono+';font-size:.76rem;background:rgba(0,0,0,.3);padding:1px 5px;border-radius:4px;color:'+t.text+';word-break:break-all;}'+
      '.blk-foot{font-size:.76rem;color:'+t.dim+';border-top:1px solid '+t.line+';padding-top:10px;line-height:1.5;}';
    var styleEl=document.createElement('style');styleEl.textContent=css;document.head.appendChild(styleEl);

    var ov=document.createElement('div');
    ov.className='blk-ov';
    ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Linked backups');
    ov.innerHTML='<div class="blk" id="'+cfg.appKey+'-blk"></div>';
    document.body.appendChild(ov);
    var panel=ov.firstChild;
    var fileInput=document.createElement('input');
    fileInput.type='file';fileInput.accept='.json,application/json,text/plain';fileInput.style.display='none';
    document.body.appendChild(fileInput);

    ov.addEventListener('click',function(e){if(e.target===ov)close();});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ov.classList.contains('on'))close();});
    panel.addEventListener('click',onClick);
    fileInput.addEventListener('change',function(){
      var f=fileInput.files&&fileInput.files[0];fileInput.value='';
      if(!f)return;
      stageOrRestore({id:'file',label:f.name,getText:function(){return f.text();}},'a file');
    });

    // restore remembered folder handle in the background
    idbGet('folder').then(function(h){if(h){folderHandle=h;render();}}).catch(function(){});

    /* ── helpers ── */
    function fileName(){return cfg.filePrefix+'-'+stamp()+'.json';}
    function isLocalFile(){return location.protocol==='file:';}
    function driveReady(){return !!st.driveClientId;}
    function linkedCount(){return (folderHandle?1:0)+(st.driveConnected&&driveReady()&&!isLocalFile()?1:0);}
    function recordBackup(where){
      st.lastBackup={ts:Date.now(),where:where};saveSt();
      try{cfg.onBackedUp&&cfg.onBackedUp(where);}catch(e){}
    }
    function setBusy(m){busy=m;notice=null;render();}
    function done(kind,text){busy='';notice={kind:kind,text:text};render();}
    function fail(e,prefix){
      if(e&&e.name==='AbortError'){busy='';render();return;}   // user closed a picker — not an error
      console.error('Linked backup:',e);
      done('err',(prefix?prefix+' ':'')+(e&&e.message?e.message:String(e)));
    }

    /* ── share sheet / file ── */
    function saveViaShareOrDownload(){
      var json=cfg.getJSON(), name=fileName();
      var file=null;
      try{file=new File([json],name,{type:'application/json'});}catch(e){}
      if(file&&navigator.canShare&&navigator.share){
        var can=false;try{can=navigator.canShare({files:[file]});}catch(e){}
        if(can){
          setBusy('Opening your share sheet…');
          navigator.share({files:[file],title:cfg.appName+' backup'}).then(function(){
            recordBackup('your share sheet');
            done('ok','Backup file sent: '+name);
          }).catch(function(e){
            if(e&&e.name==='AbortError'){busy='';render();return;}
            download(json,name);
          });
          return;
        }
      }
      download(json,name);
    }
    function download(json,name){
      var url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
      var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},4000);
      recordBackup('a downloaded file');
      done('ok','Saved '+name+' to your downloads.');
    }

    /* ── linked folder ── */
    function ensurePerm(h){
      var o={mode:'readwrite'};
      return h.queryPermission(o).then(function(p){
        if(p==='granted')return true;
        return h.requestPermission(o).then(function(p2){return p2==='granted';});
      });
    }
    function linkFolder(){
      window.showDirectoryPicker({id:cfg.appKey+'-backups',mode:'readwrite'}).then(function(h){
        folderHandle=h;listing=null;
        return idbSet('folder',h).catch(function(){}).then(function(){done('ok','Linked folder “'+h.name+'”. Backups will be saved there.');});
      }).catch(function(e){fail(e,'Couldn’t link that folder.');});
    }
    function unlinkFolder(){
      folderHandle=null;if(listing&&listing.source==='folder')listing=null;
      idbDel('folder').catch(function(){});
      done('ok','Folder unlinked. Files already in it are untouched.');
    }
    function backupToFolder(){
      if(!folderHandle)return Promise.reject(new Error('No folder linked.'));
      var name=fileName(),json=cfg.getJSON();
      return ensurePerm(folderHandle).then(function(ok){
        if(!ok)throw new Error('Permission to write to “'+folderHandle.name+'” was not granted.');
        return folderHandle.getFileHandle(name,{create:true});
      }).then(function(fh){return fh.createWritable();})
        .then(function(w){return w.write(json).then(function(){return w.close();});})
        .then(function(){return name;});
    }
    function listFolder(){
      setBusy('Reading “'+folderHandle.name+'”…');
      ensurePerm(folderHandle).then(function(ok){
        if(!ok)throw new Error('Permission to read “'+folderHandle.name+'” was not granted.');
        var out=[],it=folderHandle.values();
        function step(){
          return it.next().then(function(r){
            if(r.done)return;
            var h=r.value;
            if(h.kind==='file'&&/\.json$/i.test(h.name)){
              return h.getFile().then(function(f){
                out.push({id:'f:'+h.name,name:h.name,time:f.lastModified,size:f.size,getText:function(){return h.getFile().then(function(ff){return ff.text();});}});
              }).then(step);
            }
            return step();
          });
        }
        return step().then(function(){return out;});
      }).then(function(items){
        items.sort(function(a,b){return b.time-a.time;});
        listing={source:'folder',title:'JSON files in “'+folderHandle.name+'”',items:items.slice(0,30)};
        busy='';notice=null;render();
      }).catch(function(e){fail(e,'Couldn’t read the folder.');});
    }

    /* ── Google Drive ── */
    function loadGIS(){
      if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();
      if(gisPromise)return gisPromise;
      gisPromise=new Promise(function(res,rej){
        var s=document.createElement('script');
        s.src='https://accounts.google.com/gsi/client';s.async=true;
        s.onload=function(){res();};
        s.onerror=function(){gisPromise=null;rej(new Error('Couldn’t load Google sign-in. Check your internet connection.'));};
        document.head.appendChild(s);
      });
      return gisPromise;
    }
    function getToken(forcePrompt){
      if(!forcePrompt&&accessToken&&Date.now()<tokenExp-60000)return Promise.resolve(accessToken);
      return loadGIS().then(function(){
        return new Promise(function(res,rej){
          var client=google.accounts.oauth2.initTokenClient({
            client_id:st.driveClientId,
            scope:DRIVE_SCOPE,
            callback:function(r){
              if(r.error){rej(new Error(r.error_description||r.error));return;}
              accessToken=r.access_token;tokenExp=Date.now()+(r.expires_in||3600)*1000;
              if(!st.driveConnected){st.driveConnected=true;saveSt();}
              res(accessToken);
            },
            error_callback:function(e){
              var m=(e&&e.type==='popup_closed')?'The Google sign-in window was closed.':
                    (e&&e.type==='popup_failed_to_open')?'Your browser blocked the Google sign-in pop-up. Allow pop-ups for this page and try again.':
                    ((e&&(e.message||e.type))||'Google sign-in didn’t finish.');
              rej(new Error(m));
            }
          });
          client.requestAccessToken({prompt:st.driveConnected&&!forcePrompt?'':'consent'});
        });
      });
    }
    function gfetch(url,opts,retried){
      opts=opts||{};
      return getToken().then(function(tok){
        var o=Object.assign({},opts);o.headers=Object.assign({Authorization:'Bearer '+tok},opts.headers||{});
        return fetch(url,o);
      }).then(function(r){
        if(r.status===401&&!retried){accessToken=null;return gfetch(url,opts,true);}
        if(!r.ok){
          return r.text().then(function(txt){
            var m='';try{m=JSON.parse(txt).error.message;}catch(e){}
            throw new Error('Google Drive said: '+(m||('error '+r.status)));
          });
        }
        return r;
      });
    }
    function driveFolderId(){
      var q="name='"+cfg.driveFolderName.replace(/'/g,"\\'")+"' and mimeType='application/vnd.google-apps.folder' and trashed=false";
      return gfetch(DRIVE_API+'/files?spaces=drive&fields=files(id,name)&q='+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(j){
        if(j.files&&j.files.length)return j.files[0].id;
        return gfetch(DRIVE_API+'/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({name:cfg.driveFolderName,mimeType:'application/vnd.google-apps.folder'})})
          .then(function(r){return r.json();}).then(function(f){return f.id;});
      });
    }
    function backupToDrive(){
      var name=fileName(),json=cfg.getJSON();
      return driveFolderId().then(function(folderId){
        var meta={name:name,parents:[folderId],mimeType:'application/json'};
        var blob=new Blob([json],{type:'application/json'});
        if(blob.size<4500000){
          var b='blk'+Math.random().toString(36).slice(2);
          var body=new Blob(['--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n',blob,'\r\n--'+b+'--'],{type:'multipart/related; boundary='+b});
          return gfetch(DRIVE_UPLOAD+'?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:body});
        }
        // Large backups (lots of images) go through a resumable upload session.
        return gfetch(DRIVE_UPLOAD+'?uploadType=resumable&fields=id',{method:'POST',
          headers:{'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':'application/json'},body:JSON.stringify(meta)})
          .then(function(r){
            var loc=r.headers.get('Location');
            if(!loc)throw new Error('Google Drive didn’t return an upload address for this large backup.');
            return fetch(loc,{method:'PUT',headers:{'Content-Type':'application/json'},body:blob});
          }).then(function(r){if(!r.ok)throw new Error('Google Drive upload failed (error '+r.status+').');});
      }).then(function(){return name;});
    }
    function listDrive(){
      setBusy('Looking in Google Drive…');
      driveFolderId().then(function(fid){
        var q="'"+fid+"' in parents and trashed=false";
        return gfetch(DRIVE_API+'/files?pageSize=30&orderBy=modifiedTime%20desc&fields=files(id,name,modifiedTime,size)&q='+encodeURIComponent(q));
      }).then(function(r){return r.json();}).then(function(j){
        var items=(j.files||[]).map(function(f){
          return {id:'d:'+f.id,name:f.name,time:Date.parse(f.modifiedTime),size:f.size,
            getText:function(){return gfetch(DRIVE_API+'/files/'+encodeURIComponent(f.id)+'?alt=media').then(function(r){return r.text();});}};
        });
        listing={source:'drive',title:'Backups in Drive folder “'+cfg.driveFolderName+'”',items:items};
        busy='';notice=null;render();
      }).catch(function(e){fail(e,'Couldn’t list Drive backups.');});
    }
    function disconnectDrive(){
      try{if(accessToken&&window.google&&google.accounts&&google.accounts.oauth2)google.accounts.oauth2.revoke(accessToken,function(){});}catch(e){}
      accessToken=null;tokenExp=0;st.driveConnected=false;saveSt();
      if(listing&&listing.source==='drive')listing=null;
      done('ok','Disconnected from Google Drive. Your backups stay in Drive.');
    }

    /* ── restore ── */
    function stageOrRestore(item,fromWhere){
      if(cfg.restoreMode==='replace'){
        staged={item:item,from:fromWhere};armedId=null;notice=null;busy='';render();
        var el=panel.querySelector('.blk-stage');if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest',behavior:'smooth'});
        return;
      }
      runRestore(item);
    }
    function runRestore(item){
      setBusy('Restoring '+item.label+'…');
      Promise.resolve().then(function(){return item.getText();}).then(function(text){
        return cfg.restore(text);
      }).then(function(msg){
        staged=null;armedId=null;
        done('ok',msg||('Restored from '+item.label+'.'));
      }).catch(function(e){
        staged=null;armedId=null;
        fail(e,'Restore didn’t happen — nothing was changed.');
      });
    }

    /* ── actions ── */
    function backupAll(){
      var jobs=[];
      if(folderHandle)jobs.push(backupToFolder().then(function(){return 'folder “'+folderHandle.name+'”';}));
      if(linkedCount()>(folderHandle?1:0))jobs.push(backupToDrive().then(function(){return 'Google Drive';}));
      setBusy('Backing up to '+jobs.length+' destination'+(jobs.length>1?'s':'')+'…');
      Promise.all(jobs.map(function(p){return p.then(function(w){return {ok:true,w:w};},function(e){return {ok:false,e:e};});})).then(function(rs){
        var good=rs.filter(function(r){return r.ok;}).map(function(r){return r.w;});
        var bad=rs.filter(function(r){return !r.ok;});
        if(good.length)recordBackup(good.join(' and '));
        if(!bad.length)done('ok','Backed up to '+good.join(' and ')+'.');
        else done('err',(good.length?'Backed up to '+good.join(' and ')+', but ':'')+'one destination failed: '+(bad[0].e&&bad[0].e.message||bad[0].e));
      });
    }

    function onClick(e){
      var b=e.target.closest('[data-a]');if(!b||b.disabled)return;
      var a=b.getAttribute('data-a');
      if(a!=='arm'&&a!=='confirm')armedId=null;
      switch(a){
        case 'close':close();break;
        case 'all':backupAll();break;
        case 'share':saveViaShareOrDownload();break;
        case 'openfile':fileInput.click();break;
        case 'link':linkFolder();break;
        case 'unlink':unlinkFolder();break;
        case 'folder-up':
          setBusy('Saving to “'+folderHandle.name+'”…');
          backupToFolder().then(function(n){recordBackup('folder “'+folderHandle.name+'”');done('ok','Saved '+n+' to “'+folderHandle.name+'”.');}).catch(function(e){fail(e,'Backup to folder failed.');});
          break;
        case 'folder-list':listFolder();break;
        case 'drive-save-id':{
          var v=(panel.querySelector('#'+cfg.appKey+'-blk-cid').value||'').trim();
          if(!/\.apps\.googleusercontent\.com$/.test(v)){done('err','That doesn’t look like an OAuth client ID. It ends in “.apps.googleusercontent.com”.');break;}
          st.driveClientId=v;st.driveConnected=false;accessToken=null;saveSt();loadGIS().catch(function(){});
          done('ok','Client ID saved. Tap Connect to sign in to Google.');
          break;
        }
        case 'drive-forget-id':
          disconnectDrive();st.driveClientId='';saveSt();done('ok','Client ID removed.');break;
        case 'drive-connect':
          setBusy('Waiting for Google sign-in…');
          getToken(true).then(function(){return driveFolderId();}).then(function(){done('ok','Connected to Google Drive. Backups go to the folder “'+cfg.driveFolderName+'”.');}).catch(function(e){fail(e,'Couldn’t connect.');});
          break;
        case 'drive-up':
          setBusy('Uploading to Google Drive…');
          backupToDrive().then(function(n){recordBackup('Google Drive');done('ok','Uploaded '+n+' to Drive.');}).catch(function(e){fail(e,'Upload failed.');});
          break;
        case 'drive-list':listDrive();break;
        case 'drive-disconnect':disconnectDrive();break;
        case 'pick':{
          var id=b.getAttribute('data-id');
          var it=listing&&listing.items.filter(function(x){return x.id===id;})[0];
          if(it)stageOrRestore({id:it.id,label:it.name,getText:it.getText},listing.source==='drive'?'Google Drive':'your folder');
          break;
        }
        case 'hide-list':listing=null;render();break;
        case 'cancel-stage':staged=null;armedId=null;render();break;
        case 'arm':armedId='stage';render();break;
        case 'confirm':if(staged)runRestore(staged.item);break;
      }
    }

    /* ── render ── */
    function btn(a,label,cls,dis,extra){return '<button type="button" class="blk-btn '+(cls||'')+'" data-a="'+a+'"'+(dis?' disabled':'')+(extra||'')+'>'+label+'</button>';}

    function render(){
      var dis=!!busy, h='';
      var lb=st.lastBackup;
      h+='<div class="blk-head"><h2>Linked backups</h2><button type="button" class="blk-x" data-a="close" aria-label="Close">×</button></div>';
      h+='<p class="blk-status">'+(lb?'Last backup '+esc(ago(lb.ts))+' to '+esc(lb.where)+'.':'No backups made from here yet.')+
         ' Your regular Export and Import still work as before.</p>';

      if(busy)h+='<div class="blk-note busy" role="status">'+esc(busy)+'</div>';
      else if(notice)h+='<div class="blk-note '+notice.kind+'" role="status">'+esc(notice.text)+'</div>';

      var n=linkedCount();
      if(n>0)h+=btn('all',n>1?'Back up to all linked ('+n+')':'Back up now','pri blk-all',dis);

      if(staged){
        h+='<div class="blk-note warn blk-stage"><b>Restore “'+esc(staged.item.label)+'” from '+esc(staged.from)+'?</b><br>'+esc(cfg.restoreWarning)+
           '<div class="blk-row" style="margin-top:10px">'+
           (armedId==='stage'?btn('confirm','Tap again to restore','armed',dis):btn('arm','Restore this backup','danger',dis))+
           btn('cancel-stage','Cancel','quiet',dis)+'</div></div>';
      }

      // 1 — share sheet / file
      h+='<div class="blk-sec"><h3><span class="blk-dot on"></span>Share sheet or file</h3>'+
         '<p class="blk-p">Works on any device. On a phone, <b>Send backup file</b> opens your share sheet, where you can pick Google Drive, Files, or another app. On a computer it saves a file. <b>Open backup file</b> restores from any file you can browse to.</p>'+
         '<div class="blk-row">'+btn('share','Send backup file','pri',dis)+btn('openfile','Open backup file','',dis)+'</div></div>';

      // 2 — linked folder
      h+='<div class="blk-sec"><h3><span class="blk-dot'+(folderHandle?' on':'')+'"></span>Linked folder</h3>';
      if(!folderSupported){
        h+='<p class="blk-p">This browser can’t link a folder. Folder linking works in Chrome or Edge on a computer. Use <b>Send backup file</b> above instead.</p>';
      } else if(!folderHandle){
        h+='<p class="blk-p">Pick a folder once, such as a Google Drive, Dropbox, or OneDrive folder synced to your computer. After that, each backup is one tap.</p>'+
           '<div class="blk-row">'+btn('link','Choose folder','pri',dis)+'</div>';
      } else {
        h+='<p class="blk-p">Saving to <b>'+esc(folderHandle.name)+'</b>. Each backup is a new dated file. Your browser may ask once per visit to allow access.</p>'+
           '<div class="blk-row">'+btn('folder-up','Back up to folder','pri',dis)+btn('folder-list','Restore from folder','',dis)+btn('link','Change folder','quiet',dis)+btn('unlink','Unlink','quiet',dis)+'</div>';
      }
      h+='</div>';

      // 3 — Google Drive
      var local=isLocalFile();
      h+='<div class="blk-sec"><h3><span class="blk-dot'+(st.driveConnected&&driveReady()&&!local?' on':'')+'"></span>Google Drive</h3>';
      if(local){
        h+='<p class="blk-p">Google doesn’t allow sign-in from a page opened as a file on your device, which is how this page is open right now. To back up to Drive today, use <b>Send backup file</b> above and pick Drive. Or, on a computer, link your synced Google Drive folder. Direct Drive backup turns on when this page is opened from a web address. See the setup steps below.</p>';
      } else if(!driveReady()){
        h+='<p class="blk-p">One-time setup: paste a Google OAuth client ID, then sign in. Backups go to a folder named <b>'+esc(cfg.driveFolderName)+'</b>. This app can only see the files it creates there.</p>'+
           '<input class="blk-inp" id="'+cfg.appKey+'-blk-cid" placeholder="1234567890-abc…apps.googleusercontent.com" autocomplete="off" spellcheck="false">'+
           '<div class="blk-row">'+btn('drive-save-id','Save client ID','pri',dis)+'</div>';
      } else if(!st.driveConnected){
        h+='<p class="blk-p">Client ID saved. Connect to sign in with Google.</p>'+
           '<div class="blk-row">'+btn('drive-connect','Connect Google Drive','pri',dis)+btn('drive-forget-id','Remove client ID','quiet',dis)+'</div>';
      } else {
        h+='<p class="blk-p">Connected. Backups go to <b>'+esc(cfg.driveFolderName)+'</b> in your Drive. Google may ask you to confirm sign-in again after an hour.</p>'+
           '<div class="blk-row">'+btn('drive-up','Back up to Drive','pri',dis)+btn('drive-list','Restore from Drive','',dis)+btn('drive-disconnect','Disconnect','quiet',dis)+'</div>';
      }
      h+='<details><summary>How to set up direct Drive backup</summary><ol>'+
         '<li>Open this page from a web address instead of a file, for example by hosting it free on GitHub Pages or Netlify Drop.</li>'+
         '<li>At <code>console.cloud.google.com</code>, create a project and enable the <b>Google Drive API</b>.</li>'+
         '<li>Under <b>OAuth consent screen</b>, choose External and add your own Google account as a test user.</li>'+
         '<li>Under <b>Credentials</b>, create an <b>OAuth client ID</b> of type Web application. Add this page’s address to Authorized JavaScript origins'+(local?'.':': <code>'+esc(location.origin)+'</code>')+'</li>'+
         '<li>Paste the client ID here and tap Connect.</li></ol></details>';
      h+='</div>';

      // restore picker
      if(listing){
        h+='<div class="blk-list"><div class="blk-list-head"><span>'+esc(listing.title)+'</span>'+btn('hide-list','Hide','quiet',false)+'</div>';
        if(!listing.items.length)h+='<div class="blk-li"><span class="blk-li-meta">No backup files found here yet.</span></div>';
        listing.items.forEach(function(it){
          h+='<div class="blk-li"><div><div class="blk-li-name">'+esc(it.name)+'</div><div class="blk-li-meta">'+esc(fmtDate(it.time))+(it.size?' · '+esc(fmtSize(it.size)):'')+'</div></div>'+
             btn('pick','Restore','',dis,' data-id="'+esc(it.id)+'"')+'</div>';
        });
        h+='</div>';
      }

      h+='<p class="blk-foot" style="margin-top:12px">'+esc(cfg.footNote||'')+'</p>';
      panel.innerHTML=h;
    }

    function open(){
      notice=null;staged=null;armedId=null;
      if(driveReady()&&!isLocalFile())loadGIS().catch(function(){});   // preload so sign-in pop-ups aren't blocked
      render();ov.classList.add('on');
      var x=panel.querySelector('.blk-x');if(x)x.focus();
    }
    function close(){ov.classList.remove('on');staged=null;armedId=null;}

    return {open:open,close:close};
  }

  window.BackupLinks={init:init};
})();

</script>
<script>
(function(){
  const STORAGE_KEY = 'library-entries';
  let entries = [];
  let activeCategory = 'All';
  let searchTerm = '';
  let editingId = null;
  let viewingId = null;

  const SEED = [
    {
      title: "Welcome to your Archive",
      category: "Meta",
      tags: ["welcome", "how-to"],
      content: "This is your personal knowledge library. Add anything worth remembering — facts, how-tos, recipes, definitions, quotes, notes from a book.\n\nUse New Entry to add something. Click any card to read it, edit it, or delete it. Use the search bar or category chips to find things later. Export makes a JSON backup you can Import again anytime.\n\nFeel free to delete this card once you've got the idea."
    }
  ];

  function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(s){
    return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 1800);
  }

  // ---------------- Storage ----------------
  // Uses the browser's real localStorage — this file is meant to be opened directly
  // in a browser (or hosted somewhere), not run inside the Claude.ai artifact sandbox,
  // where localStorage is blocked. Data lives only on this device, in this browser.
  async function loadEntries(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw === null) throw new Error("no saved data yet");
      entries = JSON.parse(raw);
    }catch(e){
      // key doesn't exist yet — seed it
      entries = SEED.map(s => ({ ...s, id: uid(), updatedAt: new Date().toISOString() }));
      await persist();
    }
  }

  async function persist(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      document.getElementById('lastSaved').textContent = "Saved " + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }catch(e){
      // most likely localStorage is full, disabled, or blocked (e.g. private browsing in some browsers)
      showToast("Could not save — your browser may be blocking local storage");
    }
  }

  // ---------------- Rendering ----------------
  function allCategories(){
    const set = new Set(entries.map(e => e.category || "Uncategorized"));
    return ["All", ...Array.from(set).sort()];
  }

  function renderChips(){
    const zone = document.getElementById('categoryChips');
    zone.innerHTML = allCategories().map(c =>
      `<span class="chip ${c===activeCategory?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</span>`
    ).join('');
    zone.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        activeCategory = chip.dataset.cat;
        renderAll();
      });
    });
  }

  function filteredEntries(){
    return entries
      .filter(e => activeCategory === 'All' || (e.category || "Uncategorized") === activeCategory)
      .filter(e => {
        if(!searchTerm) return true;
        const hay = [e.title, e.category, ...(e.tags||[]), e.content].join(' ').toLowerCase();
        return hay.includes(searchTerm.toLowerCase());
      })
      .sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt));
  }

  function renderGrid(){
    const zone = document.getElementById('gridZone');
    const list = filteredEntries();
    document.getElementById('entryCount').textContent = entries.length;

    if(!entries.length){
      zone.innerHTML = `<div class="empty-state"><div class="glyph">§</div><p>The archive is empty. Add your first entry.</p></div>`;
      return;
    }
    if(!list.length){
      zone.innerHTML = `<div class="empty-state"><div class="glyph">§</div><p>Nothing matches that search or category.</p></div>`;
      return;
    }

    zone.innerHTML = `<div class="grid">${list.map((e,i) => `
      <div class="card" data-id="${e.id}">
        <span class="cat-no">${String(i+1).padStart(3,'0')}</span>
        <h3>${escapeHtml(e.title || "Untitled")}</h3>
        <div class="tag-row">
          <span class="cat-tag">${escapeHtml(e.category || "Uncategorized")}</span>
        </div>
        <div class="snippet">${escapeHtml((e.content||"").slice(0,140))}${(e.content||"").length>140?"…":""}</div>
        <div class="meta">Updated ${new Date(e.updatedAt).toLocaleDateString([], {month:'short', day:'numeric', year:'numeric'})}</div>
      </div>
    `).join('')}</div>`;

    zone.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openView(card.dataset.id));
    });
  }

  function renderAll(){
    renderChips();
    renderGrid();
  }

  // ---------------- View modal ----------------
  function openView(id){
    const e = entries.find(x => x.id === id);
    if(!e) return;
    resetDeleteArm();
    viewingId = id;
    document.getElementById('vTitle').textContent = e.title || "Untitled";
    document.getElementById('vTags').innerHTML =
      [`<span class="cat-tag">${escapeHtml(e.category || "Uncategorized")}</span>`]
      .concat((e.tags||[]).map(t => `<span class="cat-tag" style="color:var(--brass); background:var(--brass-dim);">${escapeHtml(t)}</span>`))
      .join(' ');
    document.getElementById('vContent').textContent = e.content || "";
    document.getElementById('vMeta').textContent = "Last updated " + new Date(e.updatedAt).toLocaleString();
    document.getElementById('viewOverlay').classList.remove('hidden');
  }
  function closeView(){
    resetDeleteArm();
    document.getElementById('viewOverlay').classList.add('hidden');
    viewingId = null;
  }

  // window.confirm() is blocked in this sandboxed environment, so deletes use a
  // tap-twice-to-confirm pattern on the button itself instead.
  let armedDeleteBtn = null, armedDeleteTimer = null;
  function resetDeleteArm(){
    if(armedDeleteTimer) clearTimeout(armedDeleteTimer);
    if(armedDeleteBtn){
      armedDeleteBtn.textContent = armedDeleteBtn.dataset.origText || 'Delete';
      armedDeleteBtn.classList.remove('armed');
    }
    armedDeleteBtn = null;
    armedDeleteTimer = null;
  }
  function handleDeleteClick(btn, id){
    if(armedDeleteBtn === btn){
      resetDeleteArm();
      deleteEntry(id);
      return;
    }
    resetDeleteArm();
    armedDeleteBtn = btn;
    btn.dataset.origText = btn.textContent;
    btn.textContent = 'Tap to Confirm';
    btn.classList.add('armed');
    armedDeleteTimer = setTimeout(resetDeleteArm, 2500);
  }

  // ---------------- Edit modal ----------------
  function openEdit(id){
    resetDeleteArm();
    editingId = id || null;
    const e = id ? entries.find(x => x.id === id) : null;
    document.getElementById('editTitle').textContent = e ? "Edit Entry" : "New Entry";
    document.getElementById('fTitle').value = e ? e.title : "";
    document.getElementById('fCategory').value = e ? e.category : "";
    document.getElementById('fTags').value = e ? (e.tags||[]).join(', ') : "";
    document.getElementById('fContent').value = e ? e.content : "";
    document.getElementById('deleteBtn').classList.toggle('hidden', !e);
    document.getElementById('editOverlay').classList.remove('hidden');
    document.getElementById('fTitle').focus();
  }
  function closeEdit(){
    resetDeleteArm();
    document.getElementById('editOverlay').classList.add('hidden');
    editingId = null;
  }

  async function saveEntry(){
    const title = document.getElementById('fTitle').value.trim();
    const category = document.getElementById('fCategory').value.trim() || "Uncategorized";
    const tags = document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean);
    const content = document.getElementById('fContent').value.trim();

    if(!title){ showToast("Give it a title first"); return; }

    if(editingId){
      const e = entries.find(x => x.id === editingId);
      Object.assign(e, { title, category, tags, content, updatedAt: new Date().toISOString() });
    } else {
      entries.push({ id: uid(), title, category, tags, content, updatedAt: new Date().toISOString() });
    }
    await persist();
    closeEdit();
    renderAll();
    showToast("Saved");
  }

  async function deleteEntry(id){
    entries = entries.filter(x => x.id !== id);
    await persist();
    closeEdit();
    closeView();
    renderAll();
    showToast("Deleted");
  }

  // ---------------- Export / Import ----------------
  // This file is meant to be opened directly in a browser (not inside the Claude.ai
  // artifact sandbox), so real file downloads work here — "Download File" is offered
  // alongside Copy to Clipboard. "Load from File" reads a file back into the box for import.
  let dataMode = 'export';

  function openExportModal(){
    dataMode = 'export';
    document.getElementById('dataModalTitle').textContent = 'Export Library';
    document.getElementById('dataModalDesc').textContent =
      'Copy everything below, or download it as a file. Import it again (paste or load the file) to restore it.';
    const ta = document.getElementById('dataTextarea');
    ta.value = JSON.stringify(entries, null, 2);
    ta.readOnly = true;
    document.getElementById('dataPrimaryBtn').textContent = 'Copy to Clipboard';
    document.getElementById('dataDownloadBtn').classList.remove('hidden');
    document.getElementById('dataLoadFileBtn').classList.add('hidden');
    document.getElementById('dataOverlay').classList.remove('hidden');
    ta.focus();
    ta.select();
  }

  // Mirrors Legendarium's exportJSON(): try the native share sheet first (best on mobile),
  // and only fall back to the copy/paste/download modal if sharing isn't available or is declined.
  function attemptExportShareOrModal(){
    const json = JSON.stringify(entries, null, 2);
    if(navigator.share){
      navigator.share({ title: 'Archive Backup', text: json }).catch(() => openExportModal());
    } else {
      openExportModal();
    }
  }

  function downloadExportFile(){
    const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `archive-export-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('Downloaded');
  }

  function openImportModal(){
    dataMode = 'import';
    document.getElementById('dataModalTitle').textContent = 'Import Library';
    document.getElementById('dataModalDesc').textContent =
      'Paste previously exported JSON below, or load it from a file, then click Import. New entries are added alongside what you already have.';
    const ta = document.getElementById('dataTextarea');
    ta.value = '';
    ta.readOnly = false;
    document.getElementById('dataPrimaryBtn').textContent = 'Import';
    document.getElementById('dataDownloadBtn').classList.add('hidden');
    document.getElementById('dataLoadFileBtn').classList.remove('hidden');
    document.getElementById('dataOverlay').classList.remove('hidden');
    ta.focus();
  }

  function closeDataModal(){
    document.getElementById('dataOverlay').classList.add('hidden');
  }

  // Shared by the Import box and Linked Backups. Parses an exported JSON array and merges it in.
  //
  // Ordinary entries follow the original rule: always added, never overwriting anything.
  //
  // Entries from your other apps carry a "source" field. Interchange format:
  //   [{ "id": "<stable id from that app>", "source": "gospel-study",
  //      "title": "...", "category": "...", "tags": [...], "content": "...",
  //      "updatedAt": "<ISO date>" }]
  // When one arrives with the same id AND source as an entry already here, it updates that
  // entry in place, but only if it's newer. Otherwise it's skipped as already up to date.
  async function mergeImportedText(text){
    const imported = JSON.parse(text);
    if(!Array.isArray(imported)) throw new Error("not an array");
    const byId = new Map(entries.map(e=>[e.id, e]));
    const result = { added:0, updated:0, unchanged:0 };
    imported.forEach(item => {
      if(!item || !item.title) return;
      const source = (typeof item.source === 'string') ? item.source.trim() : '';
      const existing = item.id ? byId.get(item.id) : null;
      if(source && existing && existing.source === source){
        const incoming = Date.parse(item.updatedAt) || 0;
        const current  = Date.parse(existing.updatedAt) || 0;
        if(incoming > current){
          Object.assign(existing, {
            title: item.title, category: item.category || "Uncategorized",
            tags: Array.isArray(item.tags) ? item.tags : [],
            content: item.content || "",
            updatedAt: item.updatedAt
          });
          result.updated++;
        } else {
          result.unchanged++;
        }
        return;
      }
      const id = (item.id && !byId.has(item.id)) ? item.id : uid();
      const entry = {
        id, title: item.title, category: item.category || "Uncategorized",
        tags: Array.isArray(item.tags) ? item.tags : [],
        content: item.content || "",
        updatedAt: item.updatedAt || new Date().toISOString()
      };
      if(source) entry.source = source;
      entries.push(entry);
      byId.set(id, entry);
      result.added++;
    });
    await persist();
    renderAll();
    return result;
  }

  function importSummary(r){
    const parts = [];
    if(r.added)     parts.push(`added ${r.added}`);
    if(r.updated)   parts.push(`updated ${r.updated}`);
    if(r.unchanged) parts.push(`${r.unchanged} already up to date`);
    if(!parts.length) return 'Nothing to import';
    const t = parts.join(', ');
    return t.charAt(0).toUpperCase() + t.slice(1);
  }

  async function handleDataPrimary(){
    const ta = document.getElementById('dataTextarea');
    if(dataMode === 'export'){
      try{
        await navigator.clipboard.writeText(ta.value);
        showToast('Copied to clipboard');
      }catch(e){
        ta.focus();
        ta.select();
        showToast('Press Ctrl/Cmd+C to copy the selected text');
      }
    } else {
      try{
        const r = await mergeImportedText(ta.value);
        closeDataModal();
        showToast(importSummary(r));
      }catch(e){
        showToast('That text is not valid exported JSON');
      }
    }
  }

  function loadFileIntoBox(file){
    const reader = new FileReader();
    reader.onload = () => { document.getElementById('dataTextarea').value = reader.result; };
    reader.onerror = () => showToast('Could not read that file');
    reader.readAsText(file);
  }

  // ---------------- Events ----------------
  document.getElementById('newEntryBtn').addEventListener('click', () => openEdit(null));
  document.getElementById('cancelBtn').addEventListener('click', closeEdit);
  document.getElementById('saveBtn').addEventListener('click', saveEntry);
  document.getElementById('deleteBtn').addEventListener('click', () => editingId && handleDeleteClick(document.getElementById('deleteBtn'), editingId));

  document.getElementById('vCloseBtn').addEventListener('click', closeView);
  document.getElementById('vEditBtn').addEventListener('click', () => { const id = viewingId; closeView(); openEdit(id); });
  document.getElementById('vDeleteBtn').addEventListener('click', () => viewingId && handleDeleteClick(document.getElementById('vDeleteBtn'), viewingId));

  document.getElementById('editOverlay').addEventListener('click', (e) => { if(e.target.id === 'editOverlay') closeEdit(); });
  document.getElementById('viewOverlay').addEventListener('click', (e) => { if(e.target.id === 'viewOverlay') closeView(); });
  document.getElementById('dataOverlay').addEventListener('click', (e) => { if(e.target.id === 'dataOverlay') closeDataModal(); });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){ closeEdit(); closeView(); closeDataModal(); }
  });

  let searchTimer;
  document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { searchTerm = e.target.value; renderAll(); }, 150);
  });

  document.getElementById('exportBtn').addEventListener('click', attemptExportShareOrModal);
  document.getElementById('importBtn').addEventListener('click', openImportModal);
  document.getElementById('dataPrimaryBtn').addEventListener('click', handleDataPrimary);
  document.getElementById('dataCloseBtn').addEventListener('click', closeDataModal);
  document.getElementById('dataDownloadBtn').addEventListener('click', downloadExportFile);
  document.getElementById('dataLoadFileBtn').addEventListener('click', () => document.getElementById('dataFileInput').click());
  document.getElementById('dataFileInput').addEventListener('change', (e) => {
    if(e.target.files[0]) loadFileIntoBox(e.target.files[0]);
    e.target.value = '';
  });

  // ---------------- Init ----------------
  (async function init(){
    await loadEntries();
    renderAll();
  })();

  // ---------------- Linked Backups (add-on; Export/Import above are unchanged) ----------------
  const linkedBackups = BackupLinks.init({
    appKey: 'archive',
    appName: 'The Archive',
    filePrefix: 'archive-backup',
    driveFolderName: 'The Archive Backups',
    getJSON: () => JSON.stringify(entries, null, 2),
    restoreMode: 'merge',
    restore: async (text) => {
      let r;
      try{ r = await mergeImportedText(text); }
      catch(e){ throw new Error('That file isn’t an Archive backup.'); }
      showToast(importSummary(r));
      return importSummary(r) + '.';
    },
    footNote: 'Restoring adds entries alongside what you already have, like Import does. Entries sent from your other apps update their earlier copies if they’re newer. Nothing else is overwritten.',
    theme: {
      panel:'#1a1d14', text:'#eee7d8', dim:'#a3a68c', line:'rgba(238,231,216,0.20)',
      accent:'#c9a253', accentBg:'rgba(201,162,83,0.15)', accentLine:'rgba(201,162,83,0.45)', btnBg:'#21261a',
      ok:'#8ba06a', okBg:'rgba(139,160,106,0.15)', danger:'#d07a58', dangerBg:'rgba(182,96,63,0.15)',
      head:"'Spectral', serif", body:"'Inter', sans-serif", mono:"'IBM Plex Mono', monospace",
      btnFont:"'IBM Plex Mono', monospace", btnSize:'12px', btnCase:'uppercase', z:70
    }
  });
  document.getElementById('linkedBackupBtn').addEventListener('click', () => linkedBackups.open());
})();
</script>
</body>
</html>
